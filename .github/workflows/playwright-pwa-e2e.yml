name: Playwright PWA GPS E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start_lat:
        description: "Latitude inicial X"
        required: false
        default: "-26.9204"
      start_lng:
        description: "Longitude inicial X"
        required: false
        default: "-49.0982"
      end_lat:
        description: "Latitude final Y"
        required: false
        default: "-26.9176"
      end_lng:
        description: "Longitude final Y"
        required: false
        default: "-49.0927"
      gps_duration_ms:
        description: "Duração do deslocamento GPS em ms"
        required: false
        default: "60000"

permissions:
  contents: read

concurrency:
  group: playwright-pwa-e2e-main
  cancel-in-progress: true

jobs:
  pwa-gps-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_BASE_URL: https://rotafacil-app-ruan.onrender.com
      E2E_GPS_INTERVAL_MS: '5000'
      E2E_START_LAT: ${{ github.event.inputs.start_lat || '-26.9204' }}
      E2E_START_LNG: ${{ github.event.inputs.start_lng || '-49.0982' }}
      E2E_END_LAT: ${{ github.event.inputs.end_lat || '-26.9176' }}
      E2E_END_LNG: ${{ github.event.inputs.end_lng || '-49.0927' }}
      E2E_GPS_DURATION_MS: ${{ github.event.inputs.gps_duration_ms || '60000' }}
      EXPECTED_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the exact commit on Render
        shell: bash
        run: |
          set -euo pipefail
          echo "Esperando Render publicar o commit ${EXPECTED_COMMIT}"

          for i in $(seq 1 90); do
            code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' "$E2E_BASE_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              deployed=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));process.stdout.write(String(x.commit||''));")

              if [ "$deployed" = "$EXPECTED_COMMIT" ]; then
                echo "Render está no commit correto. Iniciando Playwright."
                exit 0
              fi

              echo "Render ainda está em ${deployed:-commit-nao-informado}; esperado ${EXPECTED_COMMIT}."
            else
              echo "Render ainda não respondeu 200 (HTTP ${code})."
            fi

            echo "Tentativa $i/90; aguardando 10s..."
            sleep 10
          done

          echo "Render não publicou o commit esperado dentro do prazo."
          exit 1

      - name: Run full PWA + GPS flow
        run: npm run test:e2e:pwa

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
