name: Playwright - Fluxo PWA completo

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do Rota Fácil para testar"
        required: false
        default: "https://rotafacil-app-ruan.onrender.com"
      gps_interval_ms:
        description: "Intervalo entre mudanças do GPS (ms)"
        required: false
        default: "5000"
      gps_steps_per_leg:
        description: "Passos de GPS por trecho"
        required: false
        default: "2"
  schedule:
    # 04:30 em Blumenau/São Paulo (07:30 UTC), fora do pico da loja.
    - cron: '30 7 * * *'

permissions:
  contents: read

concurrency:
  group: playwright-full-pwa-operation
  cancel-in-progress: false

jobs:
  full-operation-flow:
    name: Loja + 8 pedidos + 3 motoboys + GPS + retorno
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ inputs.base_url || 'https://rotafacil-app-ruan.onrender.com' }}
      E2E_GPS_INTERVAL_MS: ${{ inputs.gps_interval_ms || '5000' }}
      E2E_GPS_STEPS_PER_LEG: ${{ inputs.gps_steps_per_leg || '2' }}
      E2E_RETURN_HOLD_MS: '3500'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wake up and validate Render
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing: $E2E_BASE_URL"
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$E2E_BASE_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo
              echo "Render respondeu 200."
              exit 0
            fi
            echo "Render ainda não respondeu 200 (HTTP ${code}), tentativa ${i}/30..."
            sleep 10
          done
          echo "Rota Fácil não ficou disponível a tempo."
          exit 1

      - name: Run detailed PWA end-to-end flow
        run: npm run test:e2e:full

      - name: Publish Playwright summary
        if: always()
        shell: bash
        run: |
          echo "## Rota Fácil - Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 8 pedidos de teste" >> "$GITHUB_STEP_SUMMARY"
          echo "- 3 rotas: 3 + 3 + 2" >> "$GITHUB_STEP_SUMMARY"
          echo "- 3 motoboys em sessões PWA móveis independentes" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPS muda a cada ${E2E_GPS_INTERVAL_MS}ms durante ida, entregas e retorno" >> "$GITHUB_STEP_SUMMARY"
          echo "- valida fila FIFO e isolamento entre motoboys" >> "$GITHUB_STEP_SUMMARY"
          echo "- valida que a última entrega NÃO entra em retorno automaticamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- exige clique em **Estou retornando** antes de **Entrar na fila**" >> "$GITHUB_STEP_SUMMARY"
          echo "- screenshots, vídeo/trace em falha e telemetria JSON ficam no artifact" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-operation-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
