name: Refine main orders dashboard

on:
  push:
    paths:
      - '.github/workflows/refine-main-orders-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine OperationDispatchView
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/OperationDispatchView.tsx')
          text = p.read_text(encoding='utf-8')

          # Remove unused bottleneck component import because we replace it with a lighter inline summary.
          text = text.replace("import { FleetBottleneckBanner } from './FleetBottleneckBanner';\n", "")

          # Reduce KPI row from 6 to 4 clearer cards.
          metrics_pattern = re.compile(r"  const metrics = \[.*?\n  \];", re.S)
          metrics_replacement = '''  const metrics = [
    { label: 'Ativos', value: activeOrders.length, helper: 'pedidos na operação', icon: PackageOpen, bg: 'bg-slate-100', iconTone: 'text-slate-700', valueTone: 'text-slate-950' },
    { label: 'Sem entregador', value: grouped.waiting.length, helper: grouped.waiting.length ? 'precisam de decisão' : 'nenhum aguardando', icon: Users, bg: 'bg-amber-50', iconTone: 'text-amber-600', valueTone: grouped.waiting.length ? 'text-amber-700' : 'text-slate-950' },
    { label: 'Em entrega', value: grouped.route.length, helper: grouped.route.length ? 'na rua agora' : 'nenhuma rota ativa', icon: Navigation, bg: 'bg-sky-50', iconTone: 'text-sky-600', valueTone: grouped.route.length ? 'text-sky-700' : 'text-slate-950' },
    { label: 'Livres na fila', value: queueDrivers.length, helper: queueDrivers[0] ? `${queueDrivers[0].name.split(' ')[0]} é o próximo` : 'nenhum livre agora', icon: Bike, bg: 'bg-emerald-50', iconTone: 'text-emerald-600', valueTone: queueDrivers.length ? 'text-emerald-700' : 'text-slate-950' },
  ];'''
          text, count = metrics_pattern.subn(metrics_replacement, text, count=1)
          if count != 1:
              raise SystemExit('metrics block not found')

          # KPI grid 4 columns instead of 6.
          text = text.replace('className="grid grid-cols-2 gap-2 md:grid-cols-3 xl:grid-cols-6"', 'className="grid grid-cols-2 gap-2 md:grid-cols-4"', 1)

          # Replace old bottleneck component with a subtle operational alert.
          old = '''      <FleetBottleneckBanner orders={activeOrders} motoboys={motoboys} shift={shift} onSelectOrders={(ids) => setSelected(ids)} />'''
          alert = '''      {(grouped.waiting.length > 0 || critical.length > 0) && (
        <section className="flex flex-col gap-3 rounded-2xl border border-amber-200 bg-amber-50/70 px-4 py-3 shadow-sm lg:flex-row lg:items-center lg:justify-between">
          <div className="flex min-w-0 items-start gap-3">
            <span className="mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-white text-amber-600 shadow-sm"><Zap className="h-4 w-4" /></span>
            <div className="min-w-0">
              <p className="text-[12px] font-black text-slate-900">Atenção na operação</p>
              <p className="mt-0.5 text-[10px] leading-relaxed text-slate-600">
                {grouped.waiting.length} pedido(s) aguardando entregador
                <span className="mx-1.5 text-slate-300">•</span>
                {queueDrivers.length} motoboy(s) disponível(is)
                {critical.length > 0 && <><span className="mx-1.5 text-slate-300">•</span><span className="font-bold text-rose-700">{critical.length} atenção(ões)</span></>}
              </p>
            </div>
          </div>
          <div className="flex shrink-0 flex-wrap gap-2">
            <button onClick={() => setManage(true)} className="h-8 rounded-lg border border-amber-200 bg-white px-3 text-[10px] font-black text-amber-800 hover:bg-amber-100">Ver fila</button>
            {grouped.waiting.length > 0 && queueDrivers.length > 0 && <button onClick={assignOldest} className="h-8 rounded-lg bg-slate-950 px-3 text-[10px] font-black text-white hover:bg-slate-800">Atribuir mais antigos</button>}
          </div>
        </section>
      )}'''
          if old not in text:
              raise SystemExit('FleetBottleneckBanner render not found')
          text = text.replace(old, alert, 1)

          # Make route suggestions calmer and more compact.
          text = text.replace('rounded-2xl border border-violet-200 bg-violet-50/70 p-3.5', 'rounded-2xl border border-slate-200 bg-white p-3.5 shadow-sm', 1)
          text = text.replace('rounded-lg bg-white"><Sparkles className="h-4 w-4 text-violet-600"', 'rounded-lg bg-violet-50"><Sparkles className="h-4 w-4 text-violet-600"', 1)
          text = text.replace('rounded-xl border border-violet-200 bg-white p-3 text-left hover:border-violet-400', 'rounded-xl border border-slate-200 bg-slate-50/60 p-3 text-left hover:border-violet-300 hover:bg-white', 1)

          # Remove duplicate quick-assign strip; bottleneck summary already has the action.
          duplicate_pattern = re.compile(r'''\n      \{grouped\.waiting\.length > 0 && queueDrivers\.length > 0 && <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-sm">.*?</div>\}\n''', re.S)
          text, _ = duplicate_pattern.subn('\n', text, count=1)

          # Slightly denser columns so the screen reads better at a glance.
          text = text.replace('max-h-[650px] min-h-[330px]', 'max-h-[620px] min-h-[300px]', 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-main-orders-dashboard.yml
          git add src/components/OperationDispatchView.tsx
          git commit -m "feat: refine main orders dashboard for bottleneck clarity"
          git push origin main
