name: Playwright - Sincronização multi-dispositivo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nightly-multidevice-sync.yml'
      - '.github/workflows/nightly-playwright-runner.yml'
      - 'scripts/patch-nightly-battery-ci.mjs'
      - 'tests/e2e/nightly-battery.spec.ts'
  schedule:
    - cron: '20 7 * * *'

permissions:
  contents: read

jobs:
  multidevice:
    uses: ./.github/workflows/nightly-playwright-runner.yml
    with:
      grep: '@multidevice'
      suite_name: 'Sincronização multi-dispositivo'
