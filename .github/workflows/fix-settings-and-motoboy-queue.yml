name: Fix settings modal and motoboy queue

on:
  push:
    paths:
      - '.github/workflows/fix-settings-and-motoboy-queue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch App and MotoboyApp
        shell: python
        run: |
          from pathlib import Path

          # 1) Nunca forçar Configurações da loja ao abrir/recarregar o site.
          app = Path('src/App.tsx')
          a = app.read_text(encoding='utf-8')
          a = a.replace("      if (shift.setupRequired) setIsAccountSettingsOpen(true);\n", "")
          a = a.replace(
              "        isOpen={isAccountSettingsOpen || Boolean(shift.setupRequired && isStoreAdminOrMaster)}\n        onClose={() => { if (!shift.setupRequired) setIsAccountSettingsOpen(false); }}",
              "        isOpen={isAccountSettingsOpen}\n        onClose={() => setIsAccountSettingsOpen(false)}"
          )
          app.write_text(a, encoding='utf-8')

          # 2) Aba Fila no app do motoboy.
          p = Path('src/components/MotoboyApp.tsx')
          m = p.read_text(encoding='utf-8')

          m = m.replace("  ShoppingBag,\n  X,", "  ShoppingBag,\n  Users,\n  X,")
          m = m.replace("type Tab = 'orders' | 'route' | 'history';", "type Tab = 'orders' | 'route' | 'queue' | 'history';")

          marker = "  const activeRun = driver?.status === 'delivering' && route.length > 0;\n"
          queue_block = """  const queue = useMemo(
    () => [...motoboys]
      .filter((motoboy) => motoboy.status === 'available')
      .sort((a, b) => Number(a.joinedQueueAt || Number.MAX_SAFE_INTEGER) - Number(b.joinedQueueAt || Number.MAX_SAFE_INTEGER)),
    [motoboys]
  );
  const queuePosition = driver ? queue.findIndex((motoboy) => motoboy.id === driver.id) + 1 : 0;
  const queueAhead = queuePosition > 0 ? queuePosition - 1 : 0;

""" + marker
          if marker not in m:
              raise SystemExit('activeRun marker not found')
          m = m.replace(marker, queue_block, 1)

          old_tabs = """  const tabItems: Array<{ id: Tab; label: string; icon: React.ElementType }> = [
    { id: 'orders', label: `Pedidos${inQueue ? ` (${preparing.length + ready.length})` : ''}`, icon: ShoppingBag },
    { id: 'route', label: `Minha rota${route.length ? ` (${route.length})` : ''}`, icon: Map },
    { id: 'history', label: 'Histórico', icon: History },
  ];"""
          new_tabs = """  const tabItems: Array<{ id: Tab; label: string; icon: React.ElementType }> = [
    { id: 'orders', label: `Pedidos${inQueue ? ` (${preparing.length + ready.length})` : ''}`, icon: ShoppingBag },
    { id: 'route', label: `Minha rota${route.length ? ` (${route.length})` : ''}`, icon: Map },
    { id: 'queue', label: `Fila${queuePosition ? ` (${queuePosition}º)` : ''}`, icon: Users },
    { id: 'history', label: 'Histórico', icon: History },
  ];"""
          if old_tabs not in m:
              raise SystemExit('tabItems marker not found')
          m = m.replace(old_tabs, new_tabs, 1)
          m = m.replace('      <nav className="grid grid-cols-3 gap-2 bg-[#F4F6F9] px-3 py-3">', '      <nav className="grid grid-cols-4 gap-2 bg-[#F4F6F9] px-3 py-3">', 1)
          m = m.replace('className={`flex h-16 flex-col items-center justify-center gap-1 rounded-xl text-[12px] font-black transition', 'className={`flex h-16 min-w-0 flex-col items-center justify-center gap-1 rounded-xl px-1 text-[11px] font-black transition', 1)

          history_marker = """        {tab === 'history' && <section className=\"overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm\">"""
          queue_section = """        {tab === 'queue' && <section className=\"overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm\">
          <div className=\"border-b border-slate-100 px-4 py-4\">
            <div className=\"flex items-start justify-between gap-3\">
              <div className=\"flex items-center gap-3\">
                <div className=\"grid h-10 w-10 place-items-center rounded-xl bg-violet-50 text-violet-600\"><Users className=\"h-5 w-5\"/></div>
                <div><h2 className=\"text-[17px] font-black\">Fila de motoboys</h2><p className=\"mt-0.5 text-[10px] text-slate-500\">Ordem atual para receber o próximo despacho</p></div>
              </div>
              <span className=\"rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-black text-slate-500\">{queue.length} na fila</span>
            </div>
            {driver.status === 'available' && queuePosition > 0 ? <div className=\"mt-4 rounded-xl border border-violet-200 bg-violet-50 px-4 py-3\"><div className=\"flex items-center justify-between gap-3\"><div><p className=\"text-[11px] font-bold text-violet-700\">Sua posição</p><p className=\"mt-0.5 text-[16px] font-black text-violet-950\">{queuePosition}º da fila</p></div><div className=\"text-right\"><p className=\"text-[10px] text-violet-600\">{queueAhead === 0 ? 'Você é o próximo' : `${queueAhead} ${queueAhead === 1 ? 'motoboy na sua frente' : 'motoboys na sua frente'}`}</p></div></div></div> : <div className=\"mt-4 rounded-xl bg-slate-50 px-4 py-3 text-[11px] font-bold text-slate-500\">Você não está na fila agora.</div>}
          </div>
          <div className=\"divide-y divide-slate-100\">
            {queue.length ? queue.map((motoboy, index) => {
              const isMe = motoboy.id === driver.id;
              return <div key={motoboy.id} className={`flex items-center gap-3 px-4 py-3.5 ${isMe ? 'bg-violet-50/70' : 'bg-white'}`}>
                <div className={`grid h-9 w-9 shrink-0 place-items-center rounded-full text-[12px] font-black ${index === 0 ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{index + 1}</div>
                <div className=\"min-w-0 flex-1\"><div className=\"flex items-center gap-2\"><p className=\"truncate text-[13px] font-black text-slate-900\">{motoboy.name}</p>{isMe && <span className=\"rounded-full bg-violet-100 px-2 py-0.5 text-[8px] font-black text-violet-700\">VOCÊ</span>}</div><p className=\"mt-0.5 text-[10px] text-slate-400\">{index === 0 ? 'Próximo a receber pedido' : `Aguardando · ${index} ${index === 1 ? 'motoboy antes' : 'motoboys antes'}`}</p></div>
                {index === 0 && <span className=\"rounded-full bg-emerald-50 px-2 py-1 text-[9px] font-black text-emerald-700\">PRÓXIMO</span>}
              </div>;
            }) : <div className=\"px-6 py-12 text-center\"><Users className=\"mx-auto h-9 w-9 text-slate-300\"/><p className=\"mt-3 text-[13px] font-bold text-slate-500\">Nenhum motoboy na fila.</p></div>}
          </div>
        </section>}

""" + history_marker
          if history_marker not in m:
              raise SystemExit('history section marker not found')
          m = m.replace(history_marker, queue_section, 1)
          p.write_text(m, encoding='utf-8')

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-settings-and-motoboy-queue.yml
          git add src/App.tsx src/components/MotoboyApp.tsx
          git commit -m "fix: stop forced settings modal and add driver queue tab"
          git push origin main
