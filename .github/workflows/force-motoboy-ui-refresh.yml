name: Force motoboy UI refresh

on:
  push:
    paths:
      - '.github/workflows/force-motoboy-ui-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch motoboy UI and PWA updater
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/MotoboyApp.tsx')
          t = p.read_text(encoding='utf-8')

          # Make approved mockup visually unmistakable.
          t = t.replace('className="bg-gradient-to-br from-[#071426] via-[#0A1C31] to-[#0D2744] px-4 pb-3 pt-[max(12px,env(safe-area-inset-top))] text-white"',
                        'className="bg-[#071A2E] px-4 pb-3 pt-[max(10px,env(safe-area-inset-top))] text-white"')
          t = t.replace('className="text-[20px] font-black leading-tight tracking-tight">Rota Fácil</h1>',
                        'className="text-[22px] font-black leading-tight tracking-tight">Rota Fácil</h1>')
          t = t.replace('className="grid grid-cols-3 divide-x divide-slate-200 border-b border-slate-200 bg-white px-2 py-3"',
                        'className="grid grid-cols-3 divide-x divide-slate-200 border-b border-slate-200 bg-white px-2 py-2.5"')
          t = t.replace('className="grid grid-cols-4 gap-1.5 bg-[#F4F6F9] px-2.5 py-2.5"',
                        'className="grid grid-cols-4 gap-1.5 bg-[#F4F6F9] px-2.5 py-2.5"')
          t = t.replace("? 'bg-[#081A2F] text-white shadow-sm'", "? 'bg-[#071A2E] text-white shadow-sm'")

          # Route flow copy and hierarchy closer to the approved mockup.
          t = t.replace("{activeRun ? 'Rota em andamento' : 'Próxima rota'}", "{activeRun ? 'Rota em andamento' : 'Sua rota'}")
          t = t.replace("{activeRun ? 'Siga a ordem abaixo até finalizar as entregas.' : 'Ajuste a ordem antes de iniciar.'}", "{activeRun ? 'Siga a ordem abaixo até finalizar as entregas.' : 'Confira a ordem antes de iniciar.'}")
          t = t.replace('>Iniciar esta entrega</button>', '>Próxima parada</button>')
          t = t.replace('>Iniciar rota</button>', '>Abrir rota</button>')

          # Stronger order cards, still using fewer colors.
          t = t.replace('rounded-xl border border-amber-200 bg-amber-50/55 p-4', 'rounded-xl border border-amber-200 bg-[#FFF9E8] p-4')
          t = t.replace('rounded-xl border border-emerald-200 bg-emerald-50/70 p-4', 'rounded-xl border border-emerald-200 bg-[#ECFDF7] p-4')

          p.write_text(t, encoding='utf-8')

          # Force installed PWA/home-screen app to re-check the latest shell.
          sw = Path('public/sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace("const CACHE_NAME = 'rotafacil-v4-reset';", "const CACHE_NAME = 'rotafacil-v5-ui-refresh';")
          sw.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          i = idx.read_text(encoding='utf-8')
          i = i.replace("navigator.serviceWorker.register('/sw.js').catch(() => {});",
                        "navigator.serviceWorker.register('/sw.js?v=20260910-1728', { updateViaCache: 'none' }).then((reg) => reg.update()).catch(() => {});")
          idx.write_text(i, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/force-motoboy-ui-refresh.yml
          git add src/components/MotoboyApp.tsx public/sw.js index.html
          git commit -m "feat: enforce approved motoboy UI and refresh installed PWA"
          git push origin main
