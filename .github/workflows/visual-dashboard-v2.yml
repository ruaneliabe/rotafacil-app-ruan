name: Visual Dashboard V2
on:
  push:
    paths:
      - '.github/workflows/visual-dashboard-v2.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strong visual hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/StoreDashboard.tsx')
          s = p.read_text(encoding='utf-8')
          reps = [
            # Hide low-priority savings banner from main operational flow
            ('bg-slate-900/45 border border-slate-800/70 rounded-xl px-3 py-2 shadow-sm flex flex-row items-center justify-between gap-3 text-slate-300 transition-all',
             'hidden'),

            # KPI cards -> one quiet operational strip
            ('grid grid-cols-2 lg:grid-cols-4 gap-2.5',
             'grid grid-cols-2 lg:grid-cols-4 gap-0 rounded-2xl border border-slate-800/80 bg-slate-950/35 overflow-hidden'),
            ('bg-slate-900/55 px-3.5 py-3 rounded-xl border border-slate-800/80 shadow-sm flex flex-col justify-between space-y-1.5',
             'bg-transparent px-4 py-3 rounded-none border-0 border-r border-b lg:border-b-0 border-slate-800/70 shadow-none flex flex-col justify-between space-y-1.5 last:border-r-0'),
            ('text-xl sm:text-2xl font-black text-slate-100 tracking-tight',
             'text-lg sm:text-xl font-black text-slate-100 tracking-tight'),
            ('px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-800/80 text-slate-500 border border-slate-700/70',
             'hidden xl:inline-flex px-1.5 py-0.5 rounded-md text-[9px] font-medium bg-slate-900 text-slate-600 border border-slate-800'),

            # Secondary create button loses green dominance
            ('px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md border border-emerald-400/40 transition-all flex items-center gap-1.5 cursor-pointer',
             'px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-xs rounded-lg border border-slate-700 transition-all flex items-center gap-1.5 cursor-pointer'),

            # Remove redundant all-dispatched banner row
            ('py-2 px-3 bg-slate-900/45 rounded-lg border border-slate-800 flex items-center gap-2 text-xs',
             'hidden'),

            # Map gets priority in desktop layout
            ("md:col-span-7 h-[380px] md:h-auto min-h-[320px] flex flex-col bg-slate-900/90 rounded-2xl border border-slate-800 p-2.5 space-y-2.5 shadow-sm",
             "md:col-span-8 h-[430px] md:h-auto min-h-[380px] flex flex-col bg-slate-950/45 rounded-2xl border border-slate-800/80 p-2.5 space-y-2 shadow-sm"),
            ('md:col-span-5 bg-slate-900/60 rounded-2xl p-3 border border-slate-700/70 space-y-3 flex flex-col justify-between',
             'md:col-span-4 bg-slate-950/35 rounded-2xl p-2.5 border border-slate-800/80 space-y-2.5 flex flex-col justify-between'),

            # Map controls neutral by default
            ("? 'bg-emerald-500 text-slate-950 shadow-2xs font-extrabold'",
             "? 'bg-slate-200 text-slate-950 shadow-2xs font-extrabold'"),
            ("? 'bg-blue-500 text-white shadow-2xs font-extrabold'",
             "? 'bg-slate-700 text-white shadow-2xs font-extrabold'"),

            # Driver cards flatter / quieter
            ("? 'bg-indigo-950/80 border-indigo-500 ring-2 ring-indigo-500/40'",
             "? 'bg-slate-800/90 border-slate-600 ring-1 ring-slate-500/40'"),
            (": 'bg-slate-800/90 border-slate-700/80'",
             ": 'bg-slate-900/55 border-slate-800/90'"),
            ('p-3 rounded-xl border transition-all space-y-2 shadow-2xs',
             'p-2.5 rounded-xl border transition-all space-y-2 shadow-none'),

            # Tracking box becomes neutral, not a cyan billboard
            ('bg-sky-950/80 border border-sky-500/50 p-2.5 rounded-xl flex flex-col gap-1.5 text-xs text-sky-200',
             'bg-slate-950/70 border border-slate-800 p-2 rounded-lg flex flex-col gap-1.5 text-xs text-slate-300'),
            ('font-black text-sky-300', 'font-semibold text-slate-300'),
            ('text-[10px] bg-sky-900/90 text-sky-200 px-2 py-0.5 rounded-md border border-sky-600/50 uppercase font-black',
             'text-[9px] bg-slate-900 text-slate-500 px-2 py-0.5 rounded-md border border-slate-800 uppercase font-semibold'),
            ('px-2.5 py-1 bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-extrabold text-[11px] rounded-lg transition-all flex items-center gap-1 cursor-pointer shadow-2xs uppercase',
             'px-2.5 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-[10px] rounded-lg transition-all flex items-center gap-1 cursor-pointer border border-slate-700'),
            ('px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold text-[11px] rounded-lg transition-all flex items-center gap-1 cursor-pointer shadow-2xs',
             'px-2.5 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-[10px] rounded-lg transition-all flex items-center gap-1 cursor-pointer border border-slate-700'),

            # Individual order rows quieter
            ('flex items-center justify-between p-2 rounded-lg bg-slate-900/80 border border-slate-700/60 text-xs text-slate-200',
             'flex items-center justify-between px-2 py-1.5 rounded-lg bg-slate-950/45 border border-slate-800/80 text-xs text-slate-300'),
            ('text-amber-400 font-bold shrink-0', 'text-slate-500 font-bold shrink-0'),
            ('text-amber-400 font-medium', 'text-slate-500 font-medium'),

            # Team viewport a little taller so scroll feels intentional
            ('space-y-2.5 max-h-[400px] overflow-y-auto pr-0.5',
             'space-y-2 max-h-[455px] overflow-y-auto pr-1'),
          ]
          count=0
          for a,b in reps:
            if a in s:
              s=s.replace(a,b)
              count += 1
          print('replacements applied:', count, 'of', len(reps))
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StoreDashboard.tsx
          git diff --cached --quiet || git commit -m 'Redesenha painel da loja com foco operacional'
          git push
