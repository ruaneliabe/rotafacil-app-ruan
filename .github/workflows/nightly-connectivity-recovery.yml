name: Playwright - Queda de conexão e recuperação

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nightly-connectivity-recovery.yml'
      - '.github/workflows/nightly-playwright-runner.yml'
  schedule:
    - cron: '45 8 * * *'

permissions:
  contents: read

jobs:
  recovery:
    uses: ./.github/workflows/nightly-playwright-runner.yml
    with:
      grep: '@recovery'
      suite_name: 'Queda de conexão e recuperação'
