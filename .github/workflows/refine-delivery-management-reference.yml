name: Refine delivery management reference

on:
  push:
    paths:
      - '.github/workflows/refine-delivery-management-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply reference-like delivery management layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/OperationDispatchView.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("type ManageFilter = 'all' | 'route' | 'returning' | 'delivering' | 'available';", "type ManageFilter = 'all' | 'unassigned' | 'route' | 'returning' | 'delivering' | 'available';")

          start = text.index('      {manage && (')
          end = text.index('\n    </div>\n  );', start)

          modal = r'''      {manage && (
        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-950/45 p-3 backdrop-blur-[2px]">
          <div className="flex h-[91vh] w-full max-w-[1580px] flex-col overflow-hidden rounded-[22px] border border-slate-200 bg-white shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-200 px-5 py-4">
              <div>
                <h3 className="text-[20px] font-black tracking-tight text-slate-950">Gestão de entrega</h3>
                <p className="mt-1 text-xs text-slate-500">Acompanhe em tempo real os entregadores, gerencie a fila e despache pedidos de forma rápida.</p>
              </div>
              <div className="flex items-center gap-3">
                <div className="hidden text-right md:block"><div className="flex items-center justify-end gap-2 text-[10px] text-slate-400"><span className="h-2 w-2 rounded-full bg-emerald-500" />Atualizado agora</div><div className="mt-0.5 text-[9px] font-semibold text-slate-400">em tempo real</div></div>
                <button onClick={() => p.setIsRouteModalOpen(true)} className="hidden h-10 items-center gap-2 rounded-xl bg-violet-600 px-4 text-xs font-black text-white shadow-sm hover:bg-violet-500 sm:flex"><Zap className="h-4 w-4" />Novo despacho</button>
                <button onClick={() => { setManage(false); setFocusDriverId(null); setManageFilter('all'); }} className="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white hover:bg-slate-50"><X className="h-5 w-5 text-slate-500" /></button>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 border-b border-slate-200 bg-white p-3 md:grid-cols-5">
              {[
                { label: 'Disponíveis', value: queueDrivers.length, helper: 'Livres para novos pedidos', icon: Users, tone: 'bg-emerald-50 text-emerald-600' },
                { label: 'Em rota', value: grouped.route.length, helper: 'Entregando agora', icon: Bike, tone: 'bg-blue-50 text-blue-600' },
                { label: 'Voltando', value: returningDrivers.length, helper: 'Retornando para a loja', icon: Navigation, tone: 'bg-orange-50 text-orange-600' },
                { label: 'Na loja', value: availableDrivers.length, helper: 'Aguardando despacho', icon: PackageOpen, tone: 'bg-violet-50 text-violet-600' },
                { label: 'Fila', value: grouped.waiting.length, helper: 'Pedidos para atribuir', icon: PackageOpen, tone: 'bg-slate-100 text-slate-600' },
              ].map(({ label, value, helper, icon: Icon, tone }) => (
                <div key={label} className="rounded-2xl border border-slate-200 bg-white px-3.5 py-3.5 shadow-sm">
                  <div className="flex items-center gap-3"><span className={`grid h-11 w-11 shrink-0 place-items-center rounded-xl ${tone}`}><Icon className="h-5 w-5" /></span><div className="min-w-0 flex-1"><div className="flex items-center justify-between gap-2"><span className="text-xs font-black text-slate-700">{label}</span><b className="text-xl leading-none text-slate-950">{value}</b></div><p className="mt-1 truncate text-[9px] text-slate-400">{helper}</p></div></div>
                </div>
              ))}
            </div>

            <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 bg-slate-50/45 px-4 py-3">
              <div className="relative min-w-[250px] flex-1 xl:max-w-[330px]"><Search className="absolute left-3 top-3 h-4 w-4 text-slate-400" /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar endereço no mapa..." className="h-10 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-xs outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100" /></div>
              {([
                ['all', 'Todos', activeOrders.length],
                ['unassigned', 'Sem entregador', grouped.waiting.length],
                ['route', 'Em rota', grouped.route.length],
                ['returning', 'Voltando', returningDrivers.length],
                ['delivering', 'Em entrega', deliveringDrivers.length],
                ['available', 'Disponíveis', availableDrivers.length],
              ] as Array<[ManageFilter, string, number]>).map(([id, label, count]) => (
                <button key={id} onClick={() => setManageFilter(id)} className={`inline-flex h-10 items-center gap-2 rounded-xl border px-3.5 text-[11px] font-black transition ${manageFilter === id ? 'border-violet-600 bg-violet-600 text-white shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`}>
                  {label}<span className={`rounded-md px-1.5 py-0.5 text-[9px] ${manageFilter === id ? 'bg-white/15 text-white' : 'bg-slate-100 text-slate-500'}`}>({count})</span>
                </button>
              ))}
            </div>

            <div className="grid min-h-0 flex-1 lg:grid-cols-[minmax(0,1fr)_430px]">
              <div className="relative min-h-[420px] bg-slate-100 p-3">
                <div className="h-full min-h-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                  <ReactiveRouteMap
                    origin={{ name: shift.storeName || 'Loja', address: shift.storeAddress || '', lat: shift.storeLat || -26.9194, lng: shift.storeLng || -49.0661 }}
                    stops={manageFilter === 'all' ? stops : manageFilter === 'unassigned' ? stops.filter((s) => grouped.waiting.some((o) => o.id === s.id)) : manageFilter === 'route' ? stops.filter((s) => s.status === 'in_transit') : []}
                    motoboysList={manageFilter === 'all' ? mapDrivers : manageFilter === 'returning' ? mapDrivers.filter((m) => m.status === 'returning_to_store') : manageFilter === 'delivering' ? mapDrivers.filter((m) => m.status === 'delivering') : manageFilter === 'available' ? mapDrivers.filter((m) => m.status === 'available') : []}
                    selectedMotoboyId={focusDriverId}
                    onSelectMotoboy={(id: string | null) => setFocusDriverId(id)}
                  />
                </div>
                <div className="absolute left-6 top-6 z-[60] w-[185px] overflow-hidden rounded-xl border border-slate-200 bg-white/95 shadow-lg backdrop-blur">
                  {[{ label: 'Pedidos', sub: 'Endereço do cliente', dot: 'bg-orange-500' }, { label: 'Entregadores', sub: 'Posição em tempo real', dot: 'bg-blue-600' }, { label: 'Loja', sub: shift.storeName || 'Loja', dot: 'bg-violet-600' }].map((item) => <div key={item.label} className="flex items-start gap-2.5 border-b border-slate-100 px-3 py-2.5 last:border-b-0"><span className="mt-0.5 grid h-4 w-4 place-items-center rounded bg-violet-600 text-[9px] font-black text-white">✓</span><span className={`mt-1 h-2.5 w-2.5 rounded-full ${item.dot}`} /><div><div className="text-[11px] font-black text-slate-800">{item.label}</div><div className="text-[8px] text-slate-400">{item.sub}</div></div></div>)}
                </div>
                <button onClick={() => { setFocusDriverId(null); setManageFilter('all'); }} className="absolute bottom-6 right-6 z-[60] rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-[10px] font-black text-slate-600 shadow-lg hover:bg-slate-50">Recentralizar mapa</button>
              </div>

              <aside className="min-h-0 overflow-y-auto border-l border-slate-200 bg-white p-3">
                <div className="relative mb-2"><Search className="absolute left-3 top-3 h-4 w-4 text-slate-400" /><input value={driverSearch} onChange={(e) => setDriverSearch(e.target.value)} placeholder="Buscar entregador ou pedido..." className="h-10 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-xs outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100" /></div>

                <section className="mb-2 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 bg-slate-50/50 px-3 py-2.5"><div className="flex items-center gap-2"><PackageOpen className="h-4 w-4 text-slate-500" /><h4 className="text-[11px] font-black text-slate-800">Próximos da fila ({queueDrivers.length})</h4></div><span className="text-[9px] font-bold text-violet-600">Ordem de chegada</span></div>
                  <div className="divide-y divide-slate-100">{searchedQueueDrivers.slice(0, 5).map((m, index) => <button key={m.id} onClick={() => setFocusDriverId(focusDriverId === m.id ? null : m.id)} className="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-slate-50"><span className="text-[10px] font-black text-slate-500">#{index + 1}</span><div className="min-w-0 flex-1"><b className="block truncate text-[11px] text-slate-800">{m.name}</b><span className="text-[9px] text-slate-400">{index === 0 ? 'Próximo despacho' : `${index + 1}º da fila`}</span></div><ChevronRight className="h-4 w-4 text-slate-300" /></button>)}{!searchedQueueDrivers.length && <div className="px-4 py-4 text-center text-[10px] text-slate-400">Nenhum entregador disponível na fila.</div>}</div>
                </section>

                <section className="mb-2 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 bg-slate-50/50 px-3 py-2.5"><div className="flex items-center gap-2"><Bike className="h-4 w-4 text-blue-600" /><h4 className="text-[11px] font-black text-slate-800">Motoboys em entrega ({deliveringDrivers.length})</h4></div></div>
                  <div className="divide-y divide-slate-100">{searchedDeliveringDrivers.slice(0, 6).map((m) => { const order = activeOrders.find((o) => o.assignedMotoboyId === m.id && isRoute(o)); return <button key={m.id} onClick={() => setFocusDriverId(focusDriverId === m.id ? null : m.id)} className="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-slate-50"><span className="grid h-7 w-7 place-items-center rounded-full bg-blue-600 text-white"><Bike className="h-3.5 w-3.5" /></span><div className="min-w-0 flex-1"><div className="flex items-center gap-2"><b className="truncate text-[11px] text-slate-800">{m.name}</b>{order && <span className="text-[9px] font-black text-slate-500">{code(order)}</span>}</div><p className="mt-0.5 truncate text-[9px] text-slate-400">{order?.address || 'Entrega em andamento'}</p></div><span className="whitespace-nowrap text-[9px] font-black text-emerald-600">Em entrega</span></button>; })}{!searchedDeliveringDrivers.length && <div className="px-4 py-4 text-center text-[10px] text-slate-400">Nenhum motoboy em entrega agora.</div>}</div>
                </section>

                <section className="mb-2 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 bg-slate-50/50 px-3 py-2.5"><div className="flex items-center gap-2"><Navigation className="h-4 w-4 text-orange-500" /><h4 className="text-[11px] font-black text-slate-800">Motoboys voltando ({returningDrivers.length})</h4></div></div>
                  <div className="divide-y divide-slate-100">{searchedReturningDrivers.slice(0, 5).map((m) => <div key={m.id} className="flex items-center gap-2 px-3 py-2"><button onClick={() => setFocusDriverId(focusDriverId === m.id ? null : m.id)} className="flex min-w-0 flex-1 items-center gap-2 text-left"><span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-orange-50 text-orange-500"><Navigation className="h-3.5 w-3.5" /></span><div className="min-w-0 flex-1"><b className="block truncate text-[11px] text-slate-800">{m.name}</b><p className="mt-0.5 text-[9px] text-slate-400">Retornando para a loja</p></div></button><button onClick={() => handleCallCounter(m.id, m.name)} className="rounded-lg bg-violet-50 px-2 py-1 text-[9px] font-black text-violet-700">Chamar</button></div>)}{!searchedReturningDrivers.length && <div className="px-4 py-4 text-center text-[10px] text-slate-400">Nenhum entregador retornando no momento.</div>}</div>
                </section>

                <section className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 bg-slate-50/50 px-3 py-2.5"><div className="flex items-center gap-2"><PackageOpen className="h-4 w-4 text-slate-500" /><h4 className="text-[11px] font-black text-slate-800">Pedidos sem entregador ({grouped.waiting.length})</h4></div><button onClick={() => setManageFilter('unassigned')} className="text-[9px] font-bold text-violet-600">Ver todos</button></div>
                  <div className="divide-y divide-slate-100">{grouped.waiting.slice(0, 5).map((o) => <button key={o.id} onClick={() => onSelectOrderForTracking(o)} className="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-slate-50"><span className="text-[10px] font-black text-slate-800">{code(o)}</span><div className="min-w-0 flex-1"><b className="block truncate text-[11px] text-slate-700">{o.clientName}</b><p className="mt-0.5 truncate text-[9px] text-slate-400">{o.address}</p></div><span className="whitespace-nowrap text-[9px] font-black text-rose-600">Sem entregador</span></button>)}{!grouped.waiting.length && <div className="px-4 py-4 text-center text-[10px] text-slate-400">Nenhum pedido aguardando entregador.</div>}</div>
                </section>
              </aside>
            </div>
          </div>
        </div>
      )}
'''

          path.write_text(text[:start] + modal + text[end:], encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OperationDispatchView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: align delivery management with reference"
          git push origin main
