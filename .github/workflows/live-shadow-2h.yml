name: Playwright - Operação real ao vivo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-shadow-2h.yml'
      - 'tests/e2e/live-shadow-day.spec.ts'

permissions:
  contents: read

concurrency:
  group: rotafacil-e2e-shared-firestore
  cancel-in-progress: false

env:
  CI: 'true'
  E2E_BASE_URL: https://rotafacil-app-ruan.onrender.com
  LIVE_TEST_DURATION_MINUTES: '10'
  LIVE_TEST_DRIVER_COUNT: '20'
  LIVE_TEST_GPS_INTERVAL_MS: '15000'
  LIVE_TEST_TICK_MS: '5000'
  LIVE_TEST_MAX_ORDERS: '20'
  LIVE_TEST_PICKUP_DELAY_MS: '10000'

jobs:
  live-real:
    name: Validação - pedidos reais + 20 motoboys fake
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wake up Render
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$E2E_BASE_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              echo
              echo "Rota Fácil está saudável; iniciando operação real simulada."
              exit 0
            fi
            echo "Tentativa ${i}/30: HTTP ${code}"
            sleep 10
          done
          echo "Rota Fácil não respondeu saudável a tempo."
          exit 1

      - name: Run live real-order validation
        run: npx playwright test tests/e2e/live-shadow-day.spec.ts --grep "Operação real ao vivo"

      - name: Publish live test summary
        if: always()
        shell: bash
        run: |
          echo "## Operação real ao vivo - validação" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- duração: 10 minutos" >> "$GITHUB_STEP_SUMMARY"
          echo "- 20 motoboys fake" >> "$GITHUB_STEP_SUMMARY"
          echo "- usa os pedidos reais já importados do Cardápio Web no Rota Fácil" >> "$GITHUB_STEP_SUMMARY"
          echo "- NÃO clona pedidos" >> "$GITHUB_STEP_SUMMARY"
          echo "- nenhuma escrita de volta para o Cardápio Web" >> "$GITHUB_STEP_SUMMARY"
          echo "- atribuição, GPS, entrega, retorno e reentrada na fila no Rota Fácil" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-real-validation-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
