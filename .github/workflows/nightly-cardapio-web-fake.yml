name: Playwright - Cardápio Web fake (entrada segura)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nightly-cardapio-web-fake.yml'
      - '.github/workflows/nightly-playwright-runner.yml'
      - 'tests/e2e/cardapio-fake-safe.spec.ts'
      - 'src/components/CardapioWebShadowSyncBridge.tsx'
      - 'api/webhook-cardapio-web.ts'
      - 'api/sync-cardapio-web.ts'
      - 'api/cardapio-web-shadow-sync.ts'
      - 'api/reconcile-cardapio-web-completed.ts'
      - 'api/reconcile-cardapio-web-couriers.ts'
      - 'scripts/apply-cardapio-web-import-recovery.mjs'
      - 'scripts/apply-cardapio-web-today-backfill.mjs'
      - 'scripts/apply-cardapio-web-recent-backfill.mjs'
      - 'scripts/apply-cardapio-web-rate-limit-guard.mjs'
      - 'scripts/apply-cardapio-web-runtime-firebase-fix.mjs'
      - 'scripts/apply-firebase-project-migration.mjs'
      - 'scripts/apply-firestore-quota-resilience.mjs'
      - 'scripts/apply-order-subscription-session-fallback.mjs'
      - 'package.json'
  schedule:
    # 04:35 America/Sao_Paulo (UTC-3)
    - cron: '35 7 * * *'

permissions:
  contents: read

# Compartilha o mesmo lock dos demais E2E que escrevem no Firestore.
concurrency:
  group: rotafacil-e2e-shared-firestore
  cancel-in-progress: false

jobs:
  cardapiofake:
    uses: ./.github/workflows/nightly-playwright-runner.yml
    with:
      test_file: 'tests/e2e/cardapio-fake-safe.spec.ts'
      grep: 'Cardápio Web fake entra no Rota Fácil'
      suite_name: 'Cardápio Web fake (entrada segura)'
