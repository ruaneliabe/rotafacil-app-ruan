name: Fix store opening modal

on:
  push:
    paths:
      - '.github/workflows/fix-open-store-modal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch files
        shell: python
        run: |
          from pathlib import Path

          legacy = Path('src/components/StoreDashboardLegacy.tsx')
          text = legacy.read_text(encoding='utf-8')
          old = """  // Pedidos ativos de entrega da operação atual.\n  // Pedido MANUAL pendente criado hoje precisa continuar visível mesmo com a operação fechada.\n  // Isso evita o caso em que o pedido é salvo no Firestore, entra na sugestão de rota,\n  // mas some das colunas/contadores por não existir um turno aberto no momento do cadastro.\n  const activeOrders = orders.filter((o) => {\n    if (o.status === 'delivered' || o.status === 'cancelled' || o.status === 'failed') return false;\n    if (isTakeoutOrder(o)) return false;\n\n    const isManualPendingToday =\n      o.originChannel === 'manual' &&\n      o.createdDate === todayDateKey &&\n      (o.status === 'pending' || o.status === 'preparing' || o.status === 'ready_at_counter');\n\n    if (isManualPendingToday) return true;\n    if (!shift.isOpen) return false;\n    if (!isOrderInCurrentShift(o, shift)) return false;\n    return true;\n  });"""
          new = """  // Pedidos ativos de entrega da operação atual:\n  // Se a loja estiver fechada, não há entregas ativas do dia.\n  // Se a loja estiver aberta, inclui apenas pedidos ativos pertencentes ao turno operacional atual.\n  const activeOrders = orders.filter((o) => {\n    if (o.status === 'delivered' || o.status === 'cancelled' || o.status === 'failed') return false;\n    if (isTakeoutOrder(o)) return false;\n    if (!shift.isOpen) return false;\n    if (!isOrderInCurrentShift(o, shift)) return false;\n    return true;\n  });"""
          if old in text:
              legacy.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('src/components/RuntimeCorrections.tsx')
          r = runtime.read_text(encoding='utf-8')
          marker = """    const decorate = () => {\n"""
          injection = """    const findStoreOpeningOverlay = () => {\n      return Array.from(document.querySelectorAll<HTMLElement>('div.fixed, div[role=\"dialog\"], div[class*=\"fixed\"]')).find((el) => {\n        const copy = (el.textContent || '').toLowerCase();\n        return copy.includes('abrir loja') && (copy.includes('saldo inicial') || copy.includes('antes de começar'));\n      }) || null;\n    };\n\n    const closeStoreOpeningOverlay = () => {\n      const overlay = findStoreOpeningOverlay();\n      if (!overlay) return;\n      overlay.dataset.rotaFacilOpeningDismissed = 'true';\n      overlay.style.display = 'none';\n    };\n\n    const decorateStoreOpeningModal = () => {\n      const overlay = findStoreOpeningOverlay();\n      if (!overlay || overlay.dataset.rotaFacilOpeningDecorated === 'true') return;\n      overlay.dataset.rotaFacilOpeningDecorated = 'true';\n\n      const card = Array.from(overlay.querySelectorAll<HTMLElement>('div')).find((el) => {\n        const copy = (el.textContent || '').toLowerCase();\n        return copy.includes('abrir loja') && copy.includes('saldo inicial') && el.querySelectorAll('button').length > 0;\n      }) || overlay.firstElementChild as HTMLElement | null;\n      if (!card) return;\n\n      if (getComputedStyle(card).position === 'static') card.style.position = 'relative';\n\n      const close = document.createElement('button');\n      close.type = 'button';\n      close.setAttribute('aria-label', 'Cancelar abertura da loja');\n      close.title = 'Cancelar';\n      close.innerHTML = '×';\n      close.style.cssText = 'position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:24px;line-height:28px;font-weight:400;display:grid;place-items:center;cursor:pointer;z-index:5;';\n      close.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); closeStoreOpeningOverlay(); });\n      card.appendChild(close);\n\n      const primary = Array.from(card.querySelectorAll<HTMLButtonElement>('button')).find((b) => {\n        const label = (b.textContent || '').trim().toLowerCase();\n        return label.includes('iniciar operação') || label.includes('abrir loja');\n      });\n      if (primary && !card.querySelector('[data-rota-facil-opening-cancel=\"true\"]')) {\n        const cancel = document.createElement('button');\n        cancel.type = 'button';\n        cancel.dataset.rotaFacilOpeningCancel = 'true';\n        cancel.textContent = 'Cancelar';\n        cancel.style.cssText = 'width:100%;margin-top:10px;height:38px;border-radius:9px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-size:12px;font-weight:700;cursor:pointer;';\n        cancel.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); closeStoreOpeningOverlay(); });\n        primary.insertAdjacentElement('afterend', cancel);\n      }\n    };\n\n    const decorate = () => {\n      decorateStoreOpeningModal();\n"""
          if marker not in r:
              raise SystemExit('Runtime marker not found')
          r = r.replace(marker, injection, 1)

          old_click = """    const onClick = () => { window.setTimeout(decorate, 80); window.setTimeout(decorate, 300); };\n    document.addEventListener('click', onClick);\n"""
          new_click = """    const onClick = (event: MouseEvent) => {\n      const button = (event.target as HTMLElement | null)?.closest('button');\n      const label = (button?.textContent || '').trim().toLowerCase();\n      if (button && (label === 'abrir' || label.includes('operação fechada'))) {\n        const hidden = document.querySelector<HTMLElement>('[data-rota-facil-opening-dismissed=\"true\"]');\n        if (hidden) {\n          hidden.style.display = '';\n          delete hidden.dataset.rotaFacilOpeningDismissed;\n        }\n      }\n      window.setTimeout(decorate, 80);\n      window.setTimeout(decorate, 300);\n    };\n    const onKeyDown = (event: KeyboardEvent) => {\n      if (event.key === 'Escape' && findStoreOpeningOverlay()) closeStoreOpeningOverlay();\n    };\n    document.addEventListener('click', onClick);\n    window.addEventListener('keydown', onKeyDown);\n"""
          if old_click not in r:
              raise SystemExit('Runtime click marker not found')
          r = r.replace(old_click, new_click, 1)

          old_cleanup = """      document.removeEventListener('click', onClick);\n      style.remove();\n"""
          new_cleanup = """      document.removeEventListener('click', onClick);\n      window.removeEventListener('keydown', onKeyDown);\n      style.remove();\n"""
          if old_cleanup not in r:
              raise SystemExit('Runtime cleanup marker not found')
          r = r.replace(old_cleanup, new_cleanup, 1)
          runtime.write_text(r, encoding='utf-8')

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-open-store-modal.yml
          git add src/components/StoreDashboardLegacy.tsx src/components/RuntimeCorrections.tsx
          git commit -m "fix: make store opening modal cancellable"
          git push origin main
