name: Remove right dashboard sidebar

on:
  push:
    paths:
      - '.github/workflows/remove-right-dashboard-sidebar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch OperationDispatchView
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/OperationDispatchView.tsx')
          text = p.read_text(encoding='utf-8')

          # Main board becomes full width; map/fleet stay only inside Gestão de entrega.
          text = text.replace(
              '      <div className="grid grid-cols-1 gap-3 xl:grid-cols-[minmax(0,1fr)_310px]">\n        <div className="grid min-w-0 grid-cols-1 gap-3 md:grid-cols-2 2xl:grid-cols-4">',
              '      <div className="grid min-w-0 grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4">'
          )

          # Remove desktop sidebar block only, preserving the Gestão de entrega modal below.
          pattern = re.compile(
              r'\n        </div>\n\n        <aside className="space-y-3 xl:sticky xl:top-3 xl:self-start">.*?\n        </aside>\n      </div>\n\n      \{manage &&',
              re.S,
          )
          replacement = '\n      </div>\n\n      {manage &&'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Main sidebar block not found')

          p.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-right-dashboard-sidebar.yml
          git add src/components/OperationDispatchView.tsx
          git commit -m "fix: keep main orders dashboard full width"
          git push origin main
