# trigger-2026-09-10
name: Motoboy batch flow

on:
  push:
    paths:
      - '.github/workflows/motoboy-batch-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MotoboyApp
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/MotoboyApp.tsx')
          text = p.read_text(encoding='utf-8')

          old = """  const preparing = assigned.filter((order) => ['pending', 'preparing'].includes(order.status));
  const ready = assigned.filter((order) => order.status === 'ready_at_counter');
  const rawRoute = assigned.filter(routeStatus);"""
          new = """  const preparing = assigned.filter((order) => ['pending', 'preparing'].includes(order.status));
  const individuallyReady = assigned.filter((order) => order.status === 'ready_at_counter');
  const rawRoute = assigned.filter(routeStatus);

  // A carga só muda de \"Preparando\" para \"Prontos para retirada\"
  // quando TODOS os pedidos reservados para este motoboy estiverem prontos.
  const reservedBatch = assigned.filter((order) => !routeStatus(order));
  const allReservedReady = reservedBatch.length > 0 && reservedBatch.every((order) => order.status === 'ready_at_counter');
  const preparingBatch = allReservedReady ? [] : reservedBatch;
  const ready = allReservedReady ? reservedBatch : [];"""
          if old not in text:
              raise SystemExit('status block not found')
          text = text.replace(old, new, 1)

          old = """  const enterQueue = () => {
    if (driver) {
      onConfirmArrivalAtStore?.(driver.id);
      onUpdateMotoboyStatus?.(driver.id, 'available');
    }
    setTab('orders');
  };"""
          new = """  const enterQueue = () => {
    if (driver) {
      onConfirmArrivalAtStore?.(driver.id);
      onUpdateMotoboyStatus?.(driver.id, 'available');
    }
    setTab('orders');
  };

  const leaveQueue = () => {
    if (!driver || assigned.length > 0 || route.length > 0) return;
    onUpdateMotoboyStatus?.(driver.id, 'paused');
    setTab('orders');
  };"""
          if old not in text:
              raise SystemExit('enterQueue block not found')
          text = text.replace(old, new, 1)

          text = text.replace('const orderCount = preparing.length + ready.length + unassignedPending.length;', 'const orderCount = preparingBatch.length + ready.length + unassignedPending.length;')

          start_marker = """            {inQueue && (
              <>"""
          end_marker = """              </>
            )}
          </>
        )}"""
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('inQueue block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('inQueue block end not found')
          end += len("""              </>
            )}""")

          replacement = """            {inQueue && (
              <>
                {reservedBatch.length === 0 && unassignedPending.length === 0 && (
                  <section className=\"rounded-2xl border border-slate-200 bg-white px-5 py-7 text-center shadow-sm\">
                    <div className=\"mx-auto grid h-16 w-16 place-items-center rounded-full bg-slate-50\">
                      <Clock3 className=\"h-8 w-8 text-slate-400\" />
                    </div>
                    <h2 className=\"mt-4 text-[19px] font-black tracking-tight text-slate-950\">Aguardando</h2>
                    <p className=\"mx-auto mt-1.5 max-w-[290px] text-[12px] leading-relaxed text-slate-500\">
                      Você está na fila aguardando o próximo despacho.
                    </p>
                    {queuePosition > 0 && (
                      <div className=\"mx-auto mt-4 inline-flex items-center gap-2 rounded-full bg-violet-50 px-3 py-1.5 text-[10px] font-black text-violet-700\">
                        <UsersRound className=\"h-3.5 w-3.5\" />
                        {queuePosition === 1 ? 'Você é o próximo da fila' : `${queuePosition}º na fila · ${queueAhead} na frente`}
                      </div>
                    )}
                    <button onClick={leaveQueue} className=\"mt-5 h-11 w-full rounded-xl border border-slate-200 bg-white text-[12px] font-black text-slate-600 active:bg-slate-50\">Sair da fila</button>
                  </section>
                )}

                {unassignedPending.length > 0 && reservedBatch.length === 0 && (
                  <section className=\"overflow-hidden rounded-2xl border border-violet-200 bg-white shadow-sm\">
                    <div className=\"border-b border-violet-100 bg-violet-50 px-4 py-3\">
                      <div className=\"flex items-center justify-between gap-3\">
                        <div><h2 className=\"text-[14px] font-black text-violet-950\">Próximo despacho da fila</h2><p className=\"mt-0.5 text-[10px] text-violet-700\">Você é o próximo; aguardando a loja confirmar.</p></div>
                        <span className=\"rounded-full bg-white px-2 py-1 text-[9px] font-black text-violet-700\">{unassignedPending.length}</span>
                      </div>
                    </div>
                    <div className=\"divide-y divide-slate-100\">{unassignedPending.slice(0, 3).map((order) => <div key={order.id} className=\"px-4 py-3\"><div className=\"flex items-start justify-between gap-3\"><div className=\"min-w-0\"><p className=\"truncate text-[12px] font-black text-slate-900\">#{order.codeNumber} · {order.clientName}</p><p className=\"mt-1 truncate text-[10px] text-slate-500\">{order.neighborhood || order.address}</p></div><span className=\"shrink-0 rounded-full bg-violet-50 px-2 py-1 text-[8px] font-black text-violet-700\">AGUARDANDO</span></div></div>)}</div>
                  </section>
                )}

                {reservedBatch.length > 0 && !allReservedReady && (
                  <section className=\"overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm\">
                    <div className=\"flex items-center gap-3 border-b border-slate-100 px-4 py-3.5\"><Package className=\"h-5 w-5 text-[#081A2F]\" /><div className=\"min-w-0 flex-1\"><h2 className=\"text-[17px] font-black\">Preparando</h2><p className=\"text-[11px] text-slate-500\">Aguarde todos os pedidos ficarem prontos</p></div><span className=\"rounded-full bg-slate-100 px-2 py-1 text-[9px] font-black text-slate-600\">{individuallyReady.length}/{reservedBatch.length} prontos</span></div>
                    <div className=\"space-y-2 p-3\">{preparingBatch.map((order) => { const itemReady = order.status === 'ready_at_counter'; return <article key={order.id} className={`rounded-xl border p-3.5 ${itemReady ? 'border-emerald-200 bg-emerald-50/60' : 'border-amber-200 bg-[#FFF9E8]'}`}><div className=\"flex items-center justify-between gap-3\"><strong className=\"min-w-0 truncate text-[13px]\">#{order.codeNumber} • {order.clientName}</strong><span className={`shrink-0 rounded-full bg-white px-2 py-1 text-[8px] font-black ${itemReady ? 'text-emerald-700' : 'text-amber-700'}`}>{itemReady ? 'PRONTO' : 'EM PREPARO'}</span></div><p className=\"mt-1 text-[11px] text-slate-500\">{order.neighborhood || order.address}</p><p className={`mt-3 flex items-center gap-1 text-[10px] font-bold ${itemReady ? 'text-emerald-700' : 'text-amber-700'}`}>{itemReady ? <CheckCircle2 className=\"h-3.5 w-3.5\" /> : <Clock3 className=\"h-3.5 w-3.5\" />}{itemReady ? 'Pronto · aguardando os demais pedidos' : 'Aguardando a loja marcar como pronto'}</p></article>; })}</div>
                    <div className=\"mx-3 mb-3 flex items-start gap-2 rounded-xl bg-slate-50 px-3 py-2.5 text-[10px] leading-relaxed text-slate-500\"><Info className=\"mt-0.5 h-4 w-4 shrink-0 text-slate-400\" /><span>A retirada será liberada quando <b>todos os {reservedBatch.length} pedidos</b> estiverem prontos.</span></div>
                  </section>
                )}

                {allReservedReady && (
                  <section className=\"overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm\">
                    <div className=\"flex items-center gap-3 border-b border-slate-100 px-4 py-3.5\"><ShoppingBag className=\"h-5 w-5 text-[#081A2F]\" /><div><h2 className=\"text-[17px] font-black\">Prontos para retirada ({ready.length})</h2><p className=\"text-[11px] text-slate-500\">Toda a sua carga está pronta</p></div></div>
                    <div className=\"space-y-2 p-3\">{ready.map((order) => <article key={order.id} className=\"rounded-xl border border-emerald-200 bg-emerald-50/70 p-3.5\"><div className=\"flex items-center justify-between gap-2\"><strong className=\"text-[13px]\">#{order.codeNumber} • {order.clientName}</strong><span className=\"rounded-full bg-white px-2 py-1 text-[8px] font-black text-emerald-700\">PRONTO</span></div><p className=\"mt-1 text-[11px] text-slate-500\">{order.address}</p></article>)}<button onClick={pickupAll} className=\"mt-2 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-3.5 text-[13px] font-black text-white shadow-sm active:bg-violet-700\"><CheckCircle2 className=\"h-4 w-4\" /> Confirmar retirada dos {ready.length} pedidos</button></div>
                  </section>
                )}
              </>
            )}"""

          text = text[:start] + replacement + text[end:]

          marker = """            {!inQueue && !returning && driver.status === 'delivering' && route.length === 0 && (
              <section"""
          insert = """            {!inQueue && !returning && driver.status === 'paused' && assigned.length === 0 && route.length === 0 && (
              <section className=\"rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm\">
                <div className=\"mx-auto grid h-16 w-16 place-items-center rounded-full bg-slate-50\"><UsersRound className=\"h-8 w-8 text-slate-400\" /></div>
                <h2 className=\"mt-4 text-[19px] font-black\">Fora da fila</h2>
                <p className=\"mt-1.5 text-[12px] text-slate-500\">Você não receberá novos despachos enquanto estiver fora da fila.</p>
                <button onClick={enterQueue} className=\"mt-5 h-12 w-full rounded-xl bg-violet-600 text-[13px] font-black text-white shadow-sm\">Entrar na fila</button>
              </section>
            )}

            {!inQueue && !returning && driver.status === 'delivering' && route.length === 0 && (
              <section"""
          if marker not in text:
              raise SystemExit('paused insertion marker not found')
          text = text.replace(marker, insert, 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/motoboy-batch-flow.yml
          git add src/components/MotoboyApp.tsx
          git commit -m "feat: add waiting state and batch-ready pickup flow"
          git push origin main
