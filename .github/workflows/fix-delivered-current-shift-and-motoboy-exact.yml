name: Fix delivered dashboard and motoboy exact UI

on:
  push:
    paths:
      - '.github/workflows/fix-delivered-current-shift-and-motoboy-exact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch delivered dashboard and motoboy UI
        shell: python
        run: |
          from pathlib import Path
          import re

          # --- Delivered dashboard: CURRENT OPEN SHIFT ONLY ---
          p = Path('src/components/DeliveredOrdersDashboard.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import { Order } from '../types';", "import { Order, StoreShift } from '../types';")
          text = text.replace("import { getBrazilDateKey } from '../utils/dateUtils';", "import { getBrazilDateKey, isOrderInCurrentShift } from '../utils/dateUtils';")
          text = text.replace(
              "interface DeliveredOrdersDashboardProps {\n  orders: Order[];\n}",
              "interface DeliveredOrdersDashboardProps {\n  orders: Order[];\n  shift: StoreShift;\n}"
          )
          text = text.replace(
              "export const DeliveredOrdersDashboard: React.FC<DeliveredOrdersDashboardProps> = ({ orders }) => {",
              "export const DeliveredOrdersDashboard: React.FC<DeliveredOrdersDashboardProps> = ({ orders, shift }) => {"
          )

          old_filter = """  const deliveredToday = useMemo(
    () => orders
      .filter((order) => order.status === 'delivered' && deliveredDateKey(order) === today)
      .sort((a, b) => Number(b.deliveredTimestamp || 0) - Number(a.deliveredTimestamp || 0)),
    [orders, today]
  );"""
          new_filter = """  const deliveredToday = useMemo(() => {
    if (!shift.isOpen || !shift.openedTimestamp) return [];
    const now = Date.now();
    return orders
      .filter((order) => {
        if (order.status !== 'delivered') return false;
        const deliveredTs = Number(order.deliveredTimestamp || 0);
        if (!Number.isFinite(deliveredTs) || deliveredTs <= 0) return false;
        if (deliveredTs < shift.openedTimestamp || deliveredTs > now + 60_000) return false;
        if (deliveredDateKey(order) !== today) return false;
        if (!isOrderInCurrentShift(order, shift)) return false;
        return true;
      })
      .sort((a, b) => Number(b.deliveredTimestamp || 0) - Number(a.deliveredTimestamp || 0));
  }, [orders, today, shift.isOpen, shift.openedTimestamp, shift.shiftId]);"""
          if old_filter not in text:
              raise SystemExit('Delivered filter block not found')
          text = text.replace(old_filter, new_filter, 1)
          p.write_text(text, encoding='utf-8')

          # Wire shift prop into dashboard.
          p = Path('src/components/StoreDashboardLegacy.tsx')
          text = p.read_text(encoding='utf-8')
          old = '<DeliveredOrdersDashboard orders={orders} />'
          new = '<DeliveredOrdersDashboard orders={orders} shift={shift} />'
          if old not in text:
              raise SystemExit('DeliveredOrdersDashboard call not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # --- Motoboy: apply exact approved visual directly ---
          p = Path('src/components/MotoboyApp.tsx')
          text = p.read_text(encoding='utf-8')

          # Exact compact header / KPI / tabs from approved mockup.
          text = text.replace(
              'className="bg-[#071A2E] px-4 pb-3 pt-[max(10px,env(safe-area-inset-top))] text-white"',
              'className="bg-[#071A2E] px-4 pb-2.5 pt-[max(8px,env(safe-area-inset-top))] text-white"'
          )
          text = text.replace('text-[22px] font-black leading-tight tracking-tight', 'text-[20px] font-black leading-tight tracking-tight', 1)
          text = text.replace('mt-1 flex min-w-0 items-center gap-1.5 text-[10.5px]', 'mt-0.5 flex min-w-0 items-center gap-1.5 text-[10px]', 1)
          text = text.replace(
              'className="grid grid-cols-3 divide-x divide-slate-200 border-b border-slate-200 bg-white px-2 py-2.5"',
              'className="grid grid-cols-3 divide-x divide-slate-200 border-b border-slate-200 bg-white px-2 py-2"'
          )
          text = text.replace('mt-1 text-[20px] font-black leading-none', 'mt-1 text-[18px] font-black leading-none')
          text = text.replace('mt-1 text-[16px] font-black leading-none', 'mt-1 text-[15px] font-black leading-none')
          text = text.replace(
              'className="grid grid-cols-4 gap-1.5 bg-[#F4F6F9] px-2.5 py-2.5"',
              'className="grid grid-cols-4 gap-1.5 bg-[#F4F6F9] px-2.5 py-2"'
          )
          text = text.replace('h-[58px] min-w-0', 'h-[54px] min-w-0')

          # Preparing card exactly like approved version: soft yellow, no heavy extra UI.
          text = text.replace('rounded-xl border border-amber-200 bg-[#FFF9E8] p-4', 'rounded-xl border border-amber-200 bg-[#FFF9E8] p-3.5')
          text = text.replace('rounded-xl border border-emerald-200 bg-[#ECFDF7] p-4', 'rounded-xl border border-emerald-200 bg-[#ECFDF7] p-3.5')

          # Route current stop: stronger hierarchy and correct CTA order.
          text = text.replace(
              "className={`rounded-xl border p-3.5 ${isCurrent ? 'border-violet-300 bg-violet-50/70 shadow-sm' : 'border-slate-200 bg-white'}`}",
              "className={`rounded-xl border p-3.5 ${isCurrent ? 'border-violet-300 bg-violet-50 shadow-sm' : 'border-slate-200 bg-white'}`}"
          )

          # Use current-shift-only stats in motoboy top counter too.
          old_completed = """  const completedToday = useMemo(
    () =>
      orders
        .filter((order) => mine(order) && isDelivered(order) && deliveryDayKey(order) === todayKey)
        .sort((a, b) => {
          const aa = Number(a.deliveredTimestamp || Date.parse(String(a.deliveredAt || a.createdAt)) || 0);
          const bb = Number(b.deliveredTimestamp || Date.parse(String(b.deliveredAt || b.createdAt)) || 0);
          return bb - aa;
        }),
    [orders, driver?.id, todayKey]
  );"""
          new_completed = """  const completedToday = useMemo(() => {
    if (!shift.isOpen || !shift.openedTimestamp) return [];
    return orders
      .filter((order) => {
        if (!mine(order) || order.status !== 'delivered') return false;
        const deliveredTs = Number(order.deliveredTimestamp || 0);
        if (!Number.isFinite(deliveredTs) || deliveredTs < shift.openedTimestamp) return false;
        if (deliveryDayKey(order) !== todayKey) return false;
        if (shift.shiftId && order.shiftId && order.shiftId !== shift.shiftId) return false;
        if (order.createdTimestamp && order.createdTimestamp < shift.openedTimestamp) return false;
        return true;
      })
      .sort((a, b) => Number(b.deliveredTimestamp || 0) - Number(a.deliveredTimestamp || 0));
  }, [orders, driver?.id, todayKey, shift.isOpen, shift.openedTimestamp, shift.shiftId]);"""
          if old_completed in text:
              text = text.replace(old_completed, new_completed, 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-delivered-current-shift-and-motoboy-exact.yml
          git add src/components/DeliveredOrdersDashboard.tsx src/components/StoreDashboardLegacy.tsx src/components/MotoboyApp.tsx
          git commit -m "fix: isolate delivered orders to current shift and align motoboy UI"
          git push origin main
