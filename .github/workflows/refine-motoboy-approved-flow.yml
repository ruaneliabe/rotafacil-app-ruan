name: Refine approved motoboy flow

on:
  push:
    paths:
      - '.github/workflows/refine-motoboy-approved-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MotoboyApp
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/MotoboyApp.tsx')
          text = p.read_text(encoding='utf-8')

          text = text.replace('className="rounded-xl border border-amber-200 bg-amber-50 p-4"','className="rounded-xl border border-amber-200 bg-amber-50/55 p-4"')
          text = text.replace('className="rounded-xl border border-emerald-200 bg-emerald-50 p-4"','className="rounded-xl border border-emerald-200 bg-emerald-50/70 p-4"')
          text = text.replace('className="mt-2 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 px-4 py-3.5 text-[13px] font-black text-white"','className="mt-2 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-3.5 text-[13px] font-black text-white shadow-sm active:bg-violet-700"')
          text = text.replace('className="inline-flex h-9 flex-1 items-center justify-center rounded-lg bg-amber-400 px-3 text-[11px] font-black text-slate-950"','className="inline-flex h-9 flex-1 items-center justify-center rounded-lg bg-violet-600 px-3 text-[11px] font-black text-white shadow-sm"')
          text = text.replace('className="inline-flex h-9 flex-1 items-center justify-center gap-1.5 rounded-lg bg-[#081A2F] px-3 text-[11px] font-black text-white"','className="inline-flex h-9 flex-1 items-center justify-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-black text-slate-800"')
          text = text.replace('className="inline-flex h-12 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-[12px] font-black text-white"','className="inline-flex h-12 items-center justify-center gap-2 rounded-xl bg-violet-600 text-[12px] font-black text-white shadow-sm"')
          text = text.replace('className={`rounded-xl border p-3.5 ${isCurrent ? \'border-violet-300 bg-violet-50\' : \'border-slate-200 bg-white\'}`}','className={`rounded-xl border p-3.5 ${isCurrent ? \'border-violet-300 bg-violet-50/70 shadow-sm\' : \'border-slate-200 bg-white\'}`}')
          text = text.replace("{isCurrent && <span className=\"text-[9px] font-black text-violet-700\">AGORA</span>}","{isCurrent && <span className=\"rounded-full bg-violet-100 px-2 py-1 text-[8px] font-black text-violet-700\">AGORA</span>}")

          marker = '''                  </div>\n                </section>\n\n                <section className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">\n                  <div className="flex items-center gap-3 border-b border-slate-100 px-4 py-4">\n                    <ShoppingBag'''
          replacement = '''                  </div>\n                  {preparing.length > 0 && (\n                    <div className="mx-3 mb-3 flex items-start gap-2 rounded-xl bg-slate-50 px-3 py-3 text-[10px] leading-relaxed text-slate-500">\n                      <Info className="mt-0.5 h-4 w-4 shrink-0 text-slate-400" />\n                      <span>Assim que a loja finalizar, os pedidos aparecerão em <b>Prontos para retirada</b>.</span>\n                    </div>\n                  )}\n                </section>\n\n                <section className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">\n                  <div className="flex items-center gap-3 border-b border-slate-100 px-4 py-4">\n                    <ShoppingBag'''
          if marker in text:
              text = text.replace(marker, replacement, 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-motoboy-approved-flow.yml
          git add src/components/MotoboyApp.tsx
          git commit -m "feat: polish motoboy flow to approved design"
          git push origin main
