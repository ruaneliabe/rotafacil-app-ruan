name: Final Preflight Hotfix V2
on:
  push:
    paths:
      - '.github/workflows/final-preflight-hotfix-v2.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply final operational hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,s): Path(p).write_text(s,encoding='utf-8')
          def subn(label, s, pattern, repl, flags=0):
              ns,n=re.subn(pattern,repl,s,flags=flags)
              print(label, n)
              return ns

          # ---- App.tsx ----
          p='src/App.tsx'; s=load(p)
          # Assignment functions: lookup strictly by immutable id.
          s=subn('assign lookups',s,r"const targetMotoboy = motoboys\.find\(\n\s*\(m\) =>\n\s*m\.id === motoboyId \|\|\n\s*\(m\.username[\s\S]*?m\.name\.toLowerCase\(\) === motoboyId\.toLowerCase\(\)\n\s*\)\;", "const targetMotoboy = motoboys.find((m) => m.id === motoboyId);", flags=re.M)
          # In-transit motoboy lookup strict id.
          s=subn('transit lookup',s,r"const targetMotoboy = motoboys\.find\(\n\s*\(m\) =>\n\s*m\.id === targetOrder\.assignedMotoboyId \|\|[\s\S]*?targetOrder\.assignedMotoboyName\.toLowerCase\(\)\)\n\s*\)\;", "const targetMotoboy = motoboys.find((m) => m.id === targetOrder.assignedMotoboyId);", flags=re.M)
          # Delivered lookup strict id (separate shape).
          s=subn('delivered lookup',s,r"const targetMotoboy = motoboys\.find\(\n\s*\(m\) =>\n\s*\(targetOrder\.assignedMotoboyId && m\.id === targetOrder\.assignedMotoboyId\)[\s\S]*?targetOrder\.assignedMotoboyName\.toLowerCase\(\)\)\n\s*\)\;", "const targetMotoboy = motoboys.find((m) => m.id === targetOrder.assignedMotoboyId);", flags=re.M)
          # Remaining active route strict id.
          s=s.replace("(o.assignedMotoboyId === targetMotoboy.id ||\n               (o.assignedMotoboyName && targetMotoboy.name && o.assignedMotoboyName.toLowerCase() === targetMotoboy.name.toLowerCase())) &&", "o.assignedMotoboyId === targetMotoboy.id &&")
          # Linking an order must not alter returning/offline/busy state.
          s=s.replace("status: targetMotoboy.status === 'delivering' ? 'delivering' : 'available',", "status: targetMotoboy.status,")
          # New driver starts logged-out/out of queue with zero counters.
          s=s.replace("id: `m-${Date.now()}`,\n      status: 'available',\n      activeOrdersCount: 0,\n      totalEarnedToday: newMotoboyData.fixedFee || 0,", "id: `m-${Date.now()}`,\n      status: 'offline',\n      activeOrdersCount: 0,\n      totalEarnedToday: 0,\n      deliveriesCountToday: 0,")
          # Stationary GPS heartbeat to keep location freshness alive.
          s=s.replace("if (!distChanged) return prevMotoboys;\n\n        const updatedMotoboy", "const heartbeatDue = !current.locationUpdatedAt || Date.now() - current.locationUpdatedAt >= 10000;\n        if (!distChanged && !heartbeatDue) return prevMotoboys;\n\n        const updatedMotoboy")
          save(p,s)

          # ---- firebase.ts ----
          p='src/lib/firebase.ts'; s=load(p)
          s=s.replace("      if (order.status === 'delivered' && order.deliveredDate !== today) return;\n", "")
          s=s.replace("    await resetOperationalDataOnceForCleanTest();\n", "")
          # Once IDs are strict everywhere, do not mutate historical order display names on new driver creation.
          s=s.replace("    if (isNewDriver) {\n      await isolateHistoricalOrdersFromNewDriver(payload);\n    }\n\n", "")
          save(p,s)

          # ---- StoreDashboard.tsx ----
          p='src/components/StoreDashboard.tsx'; s=load(p)
          s=s.replace("  const deliveredToday = orders.filter((o) => o.status === 'delivered');\n  const totalRevenue = orders.reduce((acc, o) => acc + o.total, 0);", "  const todayDateKey = (() => {\n    const d = new Date();\n    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\n  })();\n  const deliveredToday = orders.filter((o) => o.status === 'delivered' && o.deliveredDate === todayDateKey);\n  const todayOrders = orders.filter((o) => o.createdDate === todayDateKey || o.deliveredDate === todayDateKey);\n  const totalRevenue = todayOrders.reduce((acc, o) => acc + o.total, 0);")
          s=s.replace("{orders.length} pedidos</span>", "{todayOrders.length} pedidos</span>", 1)
          s=s.replace("(o.assignedMotoboyId === nextMotoboy.id ||\n          (nextMotoboy.username && o.assignedMotoboyId?.toLowerCase() === nextMotoboy.username.toLowerCase()) ||\n          (nextMotoboy.name && o.assignedMotoboyId?.toLowerCase() === nextMotoboy.name.toLowerCase())) &&", "o.assignedMotoboyId === nextMotoboy.id &&")
          s=s.replace("(o.assignedMotoboyId === m.id ||\n                                o.assignedMotoboyName?.toLowerCase() === m.name.toLowerCase() ||\n                                (m.username && o.assignedMotoboyId?.toLowerCase() === m.username.toLowerCase()) ||\n                                o.assignedMotoboyId?.toLowerCase() === m.name.toLowerCase())", "o.assignedMotoboyId === m.id")
          s=re.sub(r"return \(\n\s*ord\.assignedMotoboyId === selectedMotoboyId \|\|[\s\S]*?\n\s*\);", "return ord.assignedMotoboyId === selectedMotoboyId;", s, count=1)
          save(p,s)

          # ---- MotoboyApp.tsx ----
          p='src/components/MotoboyApp.tsx'; s=load(p)
          old="""  const completedOrders = useMemo(\n    () => orders.filter((o) => o.status === 'delivered' && matchesDriver(o)),\n    [orders, activeMotoboy?.id]\n  );"""
          new="""  const completedOrders = useMemo(() => {\n    const d = new Date();\n    const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\n    return orders.filter((o) => o.status === 'delivered' && o.deliveredDate === today && matchesDriver(o));\n  }, [orders, activeMotoboy?.id]);"""
          s=s.replace(old,new)
          save(p,s)

          # ---- CustomerTrackingView.tsx ----
          p='src/components/CustomerTrackingView.tsx'; s=load(p)
          old="""  const hasLiveGps = Boolean(\n    motoboy &&\n    typeof motoboy.currentLat === 'number' && motoboy.currentLat !== 0 &&\n    typeof motoboy.currentLng === 'number' && motoboy.currentLng !== 0\n  );"""
          new="""  const hasLiveGps = Boolean(\n    motoboy &&\n    typeof motoboy.currentLat === 'number' && motoboy.currentLat !== 0 &&\n    typeof motoboy.currentLng === 'number' && motoboy.currentLng !== 0 &&\n    typeof motoboy.locationUpdatedAt === 'number' &&\n    Date.now() - motoboy.locationUpdatedAt <= 30000\n  );"""
          s=s.replace(old,new)
          s=s.replace("(o.assignedMotoboyId && motoboy?.id && o.assignedMotoboyId === motoboy.id) ||\n        (o.assignedMotoboyName && motoboy?.name && o.assignedMotoboyName.toLowerCase() === motoboy.name.toLowerCase())", "o.assignedMotoboyId && motoboy?.id && o.assignedMotoboyId === motoboy.id")
          save(p,s)

          # ---- dispatchBrain.ts ----
          p='src/utils/dispatchBrain.ts'; s=load(p)
          s=s.replace("(o.assignedMotoboyId === m.id ||\n          (m.username && o.assignedMotoboyId?.toLowerCase() === m.username.toLowerCase()) ||\n          (m.name && o.assignedMotoboyId?.toLowerCase() === m.name.toLowerCase()))", "o.assignedMotoboyId === m.id")
          marker="""  const storeLat = shift.storeLat || -26.91530418395996;\n  const storeLng = shift.storeLng || -49.1146354675293;"""
          helper="""  const storeLat = shift.storeLat || -26.91530418395996;\n  const storeLng = shift.storeLng || -49.1146354675293;\n  const nowDate = new Date();\n  const todayDateKey = `${nowDate.getFullYear()}-${String(nowDate.getMonth() + 1).padStart(2, '0')}-${String(nowDate.getDate()).padStart(2, '0')}`;\n  const getOrderCreatedTimestamp = (ord: Order) => {\n    const [year, month, day] = (ord.createdDate || todayDateKey).split('-').map(Number);\n    const [hour, minute] = (ord.createdAt || '00:00').split(':').map(Number);\n    return new Date(year, (month || 1) - 1, day || 1, hour || 0, minute || 0).getTime();\n  };"""
          if 'getOrderCreatedTimestamp' not in s: s=s.replace(marker,helper)
          s=s.replace("const createdTime = new Date(ord.createdAt).getTime();", "const createdTime = getOrderCreatedTimestamp(ord);")
          s=s.replace("const deliveredToday = orders.filter((o) => o.status === 'delivered');", "const deliveredToday = orders.filter((o) => o.status === 'delivered' && o.deliveredDate === todayDateKey);")
          save(p,s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript preflight
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/lib/firebase.ts src/components/StoreDashboard.tsx src/components/MotoboyApp.tsx src/components/CustomerTrackingView.tsx src/utils/dispatchBrain.ts
          git diff --cached --quiet || git commit -m 'Hotfix tecnico final verificado para operacao'
          git push
