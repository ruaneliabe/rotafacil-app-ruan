name: Final Preflight Hotfix V2
on:
  push:
    paths:
      - '.github/workflows/final-preflight-hotfix-v2.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply final pilot hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- firebase.ts: safe partial GPS, revoked filtering and atomic order numbering ---
          p=Path('src/lib/firebase.ts'); s=p.read_text(encoding='utf-8')
          if 'runTransaction,' not in s:
              s=s.replace('  deleteDoc,\n', '  deleteDoc,\n  runTransaction,\n')
          if 'export async function updateMotoboyLocation' not in s:
              block="""export async function updateMotoboyLocation(motoboyId: string, lat: number, lng: number) {
  try {
    const ref = doc(db, 'motoboys', motoboyId);
    const snap = await getDoc(ref);
    if (!snap.exists()) return;
    const current = snap.data() as Motoboy;
    if (current.accessRevokedAt) return;
    await setDoc(ref, { currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() }, { merge: true });
  } catch (err) {
    console.warn('Could not update motoboy location:', err);
  }
}

"""
              s=s.replace('export async function saveMotoboyToCloud(motoboy: Motoboy) {', block+'export async function saveMotoboyToCloud(motoboy: Motoboy) {')
          if 'export async function reserveNextOrderCode' not in s:
              block="""export async function reserveNextOrderCode(fallbackNext: number) {
  try {
    const shiftRef = doc(db, 'shifts', 'current_shift');
    return await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(shiftRef);
      const stored = snap.exists() ? Number(snap.data().lastOrderCode || 100) : 100;
      const next = Math.max(stored + 1, fallbackNext);
      transaction.set(shiftRef, { lastOrderCode: next }, { merge: true });
      return next;
    });
  } catch (err) {
    console.warn('Could not reserve atomic order code; using local fallback:', err);
    return fallbackNext;
  }
}

"""
              s=s.replace('export async function saveOrderToCloud(order: Order) {', block+'export async function saveOrderToCloud(order: Order) {')
          s=s.replace("      const raw = { id: docSnap.id, ...docSnap.data() } as Motoboy;\n      if (raw.statsDate !== today) {", "      const raw = { id: docSnap.id, ...docSnap.data() } as Motoboy;\n      if (raw.accessRevokedAt) return;\n      if (raw.statsDate !== today) {")
          p.write_text(s,encoding='utf-8')

          # --- App.tsx: one GPS cloud writer, delivery debounce, atomic code reservation ---
          p=Path('src/App.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import React, { useState, useEffect } from 'react';", "import React, { useState, useEffect, useRef } from 'react';")
          if 'updateMotoboyLocation,' not in s:
              s=s.replace('  saveMotoboyToCloud,\n', '  saveMotoboyToCloud,\n  updateMotoboyLocation,\n  reserveNextOrderCode,\n', 1)
          elif 'reserveNextOrderCode,' not in s:
              s=s.replace('  updateMotoboyLocation,\n', '  updateMotoboyLocation,\n  reserveNextOrderCode,\n', 1)
          gps_old="""        const updatedMotoboy = { ...current, currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() };
        saveMotoboyToCloud(updatedMotoboy);"""
          gps_new="""        const updatedMotoboy = { ...current, currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() };
        updateMotoboyLocation(motoboyId, lat, lng);"""
          s=s.replace(gps_old,gps_new,1)
          if 'deliveryActionsInFlightRef' not in s:
              s=s.replace("  const [isOnline, setIsOnline] = useState<boolean>(() => navigator.onLine);", "  const [isOnline, setIsOnline] = useState<boolean>(() => navigator.onLine);\n  const deliveryActionsInFlightRef = useRef<Set<string>>(new Set());")
              s=s.replace("    if (targetOrder.status === 'delivered' || targetOrder.status === 'cancelled') return;", "    if (targetOrder.status === 'delivered' || targetOrder.status === 'cancelled') return;\n    if (status === 'delivered') {\n      if (deliveryActionsInFlightRef.current.has(orderId)) return;\n      deliveryActionsInFlightRef.current.add(orderId);\n      window.setTimeout(() => deliveryActionsInFlightRef.current.delete(orderId), 5000);\n    }")
          s=s.replace("  const handleAddOrder = (\n", "  const handleAddOrder = async (\n", 1)
          s=s.replace("    const maxCode = orders.reduce((max, o) => Math.max(max, o.codeNumber || 0), 100);\n    const nextCode = maxCode + 1;", "    const maxCode = orders.reduce((max, o) => Math.max(max, o.codeNumber || 0), 100);\n    const nextCode = await reserveNextOrderCode(maxCode + 1);")
          p.write_text(s,encoding='utf-8')

          # --- MotoboyApp: its GPS watcher is UI-only; App owns cloud GPS writes ---
          p=Path('src/components/MotoboyApp.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import { saveMotoboyToCloud } from '../lib/firebase';\n", "")
          old="""      if (activeMotoboy && (Math.abs((activeMotoboy.currentLat || 0) - lat) > 0.0001 || Math.abs((activeMotoboy.currentLng || 0) - lng) > 0.0001)) {
        saveMotoboyToCloud({ ...activeMotoboy, currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() });
      }"""
          s=s.replace(old,'')
          p.write_text(s,encoding='utf-8')

          # --- Customer tracking: GPS becomes stale automatically after 30s without heartbeat ---
          p=Path('src/components/CustomerTrackingView.tsx'); s=p.read_text(encoding='utf-8')
          if 'const [nowMs, setNowMs]' not in s:
              s=s.replace("  isOperator = false,\n}) => {", "  isOperator = false,\n}) => {\n  const [nowMs, setNowMs] = React.useState(() => Date.now());\n  React.useEffect(() => {\n    const timer = window.setInterval(() => setNowMs(Date.now()), 5000);\n    return () => window.clearInterval(timer);\n  }, []);")
          s=s.replace('Date.now() - motoboy.locationUpdatedAt <= 30000', 'nowMs - motoboy.locationUpdatedAt <= 30000')
          p.write_text(s,encoding='utf-8')

          # --- Store dashboard: PC refresh button must never impersonate a driver's GPS ---
          p=Path('src/components/StoreDashboard.tsx'); s=p.read_text(encoding='utf-8')
          start=s.find("onClick={() => {\n                          if (typeof window !== 'undefined' && 'geolocation' in navigator) {")
          if start >= 0:
              cls=s.find('className="p-1.5 bg-slate-800 hover:bg-emerald-500/20', start)
              if cls >= 0:
                  safe="""onClick={() => {
                          triggerActionToast('📡 Mapa sincronizado automaticamente pelos celulares dos motoboys.');
                        }}
                        """
                  s=s[:start]+safe+s[cls:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript preflight
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified final hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/lib/firebase.ts src/components/MotoboyApp.tsx src/components/CustomerTrackingView.tsx src/components/StoreDashboard.tsx
          git diff --cached --quiet || git commit -m 'Fecha preflight operacional com GPS e concorrencia seguros'
          git push
