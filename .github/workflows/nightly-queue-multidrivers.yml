name: Playwright - Fila e múltiplos motoboys

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nightly-queue-multidrivers.yml'
      - '.github/workflows/nightly-playwright-runner.yml'
  schedule:
    - cron: '45 7 * * *'

permissions:
  contents: read

jobs:
  queue:
    uses: ./.github/workflows/nightly-playwright-runner.yml
    with:
      grep: '@queue'
      suite_name: 'Fila e múltiplos motoboys'
