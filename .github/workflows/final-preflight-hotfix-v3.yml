name: Final Preflight Hotfix V3
on:
  push:
    paths:
      - '.github/workflows/final-preflight-hotfix-v3.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply GPS and idempotency hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # firebase: dedicated partial GPS update that can never recreate a deleted/revoked driver.
          p=Path('src/lib/firebase.ts'); s=p.read_text(encoding='utf-8')
          marker="""export async function saveMotoboyToCloud(motoboy: Motoboy) {"""
          fn="""export async function updateMotoboyLocation(motoboyId: string, lat: number, lng: number) {\n  try {\n    const ref = doc(db, 'motoboys', motoboyId);\n    const snap = await getDoc(ref);\n    if (!snap.exists()) return;\n    const current = snap.data() as Motoboy;\n    if (current.accessRevokedAt) return;\n    await setDoc(ref, { currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() }, { merge: true });\n  } catch (err) {\n    console.warn('Could not update motoboy location:', err);\n  }\n}\n\n"""
          if 'export async function updateMotoboyLocation' not in s:
              s=s.replace(marker,fn+marker)
          p.write_text(s,encoding='utf-8')

          # App: GPS uses partial write; same-device delivered action guarded against rapid duplicate taps.
          p=Path('src/App.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import React, { useState, useEffect } from 'react';", "import React, { useState, useEffect, useRef } from 'react';")
          s=s.replace("  saveMotoboyToCloud,\n", "  saveMotoboyToCloud,\n  updateMotoboyLocation,\n", 1)
          s=s.replace("        saveMotoboyToCloud(updatedMotoboy);", "        updateMotoboyLocation(motoboyId, lat, lng);", 1)
          state_marker="""  const [cloudSynced, setCloudSynced] = useState(false);\n  const [isOnline, setIsOnline] = useState<boolean>(() => navigator.onLine);"""
          state_new="""  const [cloudSynced, setCloudSynced] = useState(false);\n  const [isOnline, setIsOnline] = useState<boolean>(() => navigator.onLine);\n  const deliveryActionsInFlightRef = useRef<Set<string>>(new Set());"""
          s=s.replace(state_marker,state_new)
          guard_marker="""    if (targetOrder.status === status) return;\n    if (targetOrder.status === 'delivered' || targetOrder.status === 'cancelled') return;"""
          guard_new="""    if (targetOrder.status === status) return;\n    if (targetOrder.status === 'delivered' || targetOrder.status === 'cancelled') return;\n    if (status === 'delivered') {\n      if (deliveryActionsInFlightRef.current.has(orderId)) return;\n      deliveryActionsInFlightRef.current.add(orderId);\n      window.setTimeout(() => deliveryActionsInFlightRef.current.delete(orderId), 5000);\n    }"""
          s=s.replace(guard_marker,guard_new)
          p.write_text(s,encoding='utf-8')

          # MotoboyApp: local GPS watcher only drives local UI. App.tsx is the sole cloud GPS writer.
          p=Path('src/components/MotoboyApp.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import { saveMotoboyToCloud } from '../lib/firebase';\n", "")
          s=re.sub(r"\n\s*if \(activeMotoboy && \(Math\.abs\(\(activeMotoboy\.currentLat \|\| 0\) - lat\) > 0\.0001 \|\| Math\.abs\(\(activeMotoboy\.currentLng \|\| 0\) - lng\) > 0\.0001\)\) \{\n\s*saveMotoboyToCloud\(\{ \.\.\.activeMotoboy, currentLat: lat, currentLng: lng, locationUpdatedAt: Date\.now\(\) \}\);\n\s*\}", "", s, count=1)
          p.write_text(s,encoding='utf-8')

          # Customer tracking: staleness must update even when no new Firestore snapshots arrive.
          p=Path('src/components/CustomerTrackingView.tsx'); s=p.read_text(encoding='utf-8')
          props_end="""  isOperator = false,\n}) => {"""
          with_tick="""  isOperator = false,\n}) => {\n  const [nowMs, setNowMs] = React.useState(() => Date.now());\n  React.useEffect(() => {\n    const timer = window.setInterval(() => setNowMs(Date.now()), 5000);\n    return () => window.clearInterval(timer);\n  }, []);"""
          s=s.replace(props_end,with_tick)
          s=s.replace("Date.now() - motoboy.locationUpdatedAt <= 30000", "nowMs - motoboy.locationUpdatedAt <= 30000")
          p.write_text(s,encoding='utf-8')

          # Store dashboard: admin PC never writes a driver's GPS. Keep button as harmless sync info.
          p=Path('src/components/StoreDashboard.tsx'); s=p.read_text(encoding='utf-8')
          pattern=r"onClick=\{\(\) => \{\n\s*if \(typeof window !== 'undefined' && 'geolocation' in navigator\) \{[\s\S]*?\n\s*\}\n\s*\}\}\n\s*className=\"p-1\.5 bg-slate-800 hover:bg-emerald-500/20"
          repl="""onClick={() => {\n                          triggerActionToast('📡 O mapa recebe o GPS automaticamente dos celulares dos motoboys.');\n                        }}\n                        className=\"p-1.5 bg-slate-800 hover:bg-emerald-500/20""""
          s,n=re.subn(pattern,repl,s,count=1)
          print('admin GPS button neutralized:',n)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript preflight
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/lib/firebase.ts src/components/MotoboyApp.tsx src/components/CustomerTrackingView.tsx src/components/StoreDashboard.tsx
          git diff --cached --quiet || git commit -m 'Endurece GPS e conclusao de entrega para operacao'
          git push
