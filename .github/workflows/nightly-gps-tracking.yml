name: Playwright - Rotas, GPS e rastreamento

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nightly-gps-tracking.yml'
      - '.github/workflows/nightly-playwright-runner.yml'
  schedule:
    - cron: '15 8 * * *'

permissions:
  contents: read

jobs:
  gps:
    uses: ./.github/workflows/nightly-playwright-runner.yml
    with:
      grep: '@gps'
      suite_name: 'Rotas, GPS e rastreamento'
