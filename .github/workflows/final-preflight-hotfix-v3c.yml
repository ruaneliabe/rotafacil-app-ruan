name: Final Preflight Hotfix V3C
on:
  push:
    paths:
      - '.github/workflows/final-preflight-hotfix-v3c.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply critical data hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/lib/firebase.ts'); s=p.read_text(encoding='utf-8')
          if 'export async function updateMotoboyLocation' not in s:
              block="""export async function updateMotoboyLocation(motoboyId: string, lat: number, lng: number) {
  try {
    const ref = doc(db, 'motoboys', motoboyId);
    const snap = await getDoc(ref);
    if (!snap.exists()) return;
    const current = snap.data() as Motoboy;
    if (current.accessRevokedAt) return;
    await setDoc(ref, { currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() }, { merge: true });
  } catch (err) {
    console.warn('Could not update motoboy location:', err);
  }
}

"""
              s=s.replace('export async function saveMotoboyToCloud(motoboy: Motoboy) {', block+'export async function saveMotoboyToCloud(motoboy: Motoboy) {')
          s=s.replace("      const raw = { id: docSnap.id, ...docSnap.data() } as Motoboy;\n      if (raw.statsDate !== today) {", "      const raw = { id: docSnap.id, ...docSnap.data() } as Motoboy;\n      if (raw.accessRevokedAt) return;\n      if (raw.statsDate !== today) {")
          p.write_text(s,encoding='utf-8')

          p=Path('src/App.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import React, { useState, useEffect } from 'react';", "import React, { useState, useEffect, useRef } from 'react';")
          if 'updateMotoboyLocation,' not in s:
              s=s.replace('  saveMotoboyToCloud,\n', '  saveMotoboyToCloud,\n  updateMotoboyLocation,\n', 1)
          s=s.replace("        saveMotoboyToCloud(updatedMotoboy);\n        const updatedList = [...prevMotoboys];", "        updateMotoboyLocation(motoboyId, lat, lng);\n        const updatedList = [...prevMotoboys];", 1)
          if 'deliveryActionsInFlightRef' not in s:
              s=s.replace("  const [isOnline, setIsOnline] = useState<boolean>(() => navigator.onLine);", "  const [isOnline, setIsOnline] = useState<boolean>(() => navigator.onLine);\n  const deliveryActionsInFlightRef = useRef<Set<string>>(new Set());")
              s=s.replace("    if (targetOrder.status === 'delivered' || targetOrder.status === 'cancelled') return;", "    if (targetOrder.status === 'delivered' || targetOrder.status === 'cancelled') return;\n    if (status === 'delivered') {\n      if (deliveryActionsInFlightRef.current.has(orderId)) return;\n      deliveryActionsInFlightRef.current.add(orderId);\n      window.setTimeout(() => deliveryActionsInFlightRef.current.delete(orderId), 5000);\n    }")
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/MotoboyApp.tsx'); s=p.read_text(encoding='utf-8')
          s=s.replace("import { saveMotoboyToCloud } from '../lib/firebase';\n", "")
          old="""      if (activeMotoboy && (Math.abs((activeMotoboy.currentLat || 0) - lat) > 0.0001 || Math.abs((activeMotoboy.currentLng || 0) - lng) > 0.0001)) {
        saveMotoboyToCloud({ ...activeMotoboy, currentLat: lat, currentLng: lng, locationUpdatedAt: Date.now() });
      }"""
          s=s.replace(old,'')
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/CustomerTrackingView.tsx'); s=p.read_text(encoding='utf-8')
          if 'const [nowMs, setNowMs]' not in s:
              s=s.replace("  isOperator = false,\n}) => {", "  isOperator = false,\n}) => {\n  const [nowMs, setNowMs] = React.useState(() => Date.now());\n  React.useEffect(() => {\n    const timer = window.setInterval(() => setNowMs(Date.now()), 5000);\n    return () => window.clearInterval(timer);\n  }, []);")
          s=s.replace('Date.now() - motoboy.locationUpdatedAt <= 30000', 'nowMs - motoboy.locationUpdatedAt <= 30000')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript preflight
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/lib/firebase.ts src/components/MotoboyApp.tsx src/components/CustomerTrackingView.tsx
          git diff --cached --quiet || git commit -m 'Endurece sincronizacao GPS e conclusao de entrega'
          git push
