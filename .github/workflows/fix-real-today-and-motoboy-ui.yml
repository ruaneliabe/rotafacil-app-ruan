name: Fix real today and motoboy UI

on:
  push:
    paths:
      - '.github/workflows/fix-real-today-and-motoboy-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current shift filtering and motoboy UI
        shell: python
        run: |
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # Delivered dashboard: ONLY orders created + delivered in the
          # current open operation. This prevents historical CW imports
          # that received a fresh deliveredTimestamp from contaminating today.
          # ------------------------------------------------------------
          p = Path('src/components/DeliveredOrdersDashboard.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import { Order } from '../types';", "import { Order, StoreShift } from '../types';")
          text = text.replace("interface DeliveredOrdersDashboardProps {\n  orders: Order[];\n}", "interface DeliveredOrdersDashboardProps {\n  orders: Order[];\n  shift: StoreShift;\n}")
          text = text.replace(
              "export const DeliveredOrdersDashboard: React.FC<DeliveredOrdersDashboardProps> = ({ orders }) => {",
              "export const DeliveredOrdersDashboard: React.FC<DeliveredOrdersDashboardProps> = ({ orders, shift }) => {"
          )

          old = """  const deliveredToday = useMemo(
    () => orders
      .filter((order) => order.status === 'delivered' && deliveredDateKey(order) === today)
      .sort((a, b) => Number(b.deliveredTimestamp || 0) - Number(a.deliveredTimestamp || 0)),
    [orders, today]
  );"""
          new = """  const deliveredToday = useMemo(() => {
    const openedAt = Number(shift.openedTimestamp || 0);
    const currentShiftId = shift.shiftId || '';

    return orders
      .filter((order) => {
        if (order.status !== 'delivered') return false;
        if (deliveredDateKey(order) !== today) return false;

        const deliveredTs = Number(order.deliveredTimestamp || 0);
        const createdTs = Number(order.createdTimestamp || 0);
        if (!deliveredTs || !createdTs) return false;

        // Pedido antigo importado/sincronizado não pertence ao turno atual,
        // mesmo que tenha recebido deliveredTimestamp hoje por algum sync.
        if (openedAt && (deliveredTs < openedAt || createdTs < openedAt)) return false;
        if (currentShiftId && order.shiftId && order.shiftId !== currentShiftId) return false;
        if (order.createdDate && order.createdDate !== today) return false;

        return true;
      })
      .sort((a, b) => Number(b.deliveredTimestamp || 0) - Number(a.deliveredTimestamp || 0));
  }, [orders, today, shift.openedTimestamp, shift.shiftId]);"""
          if old not in text:
              raise SystemExit('Delivered dashboard filter block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Pass shift into delivered dashboard.
          p = Path('src/components/StoreDashboardLegacy.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<DeliveredOrdersDashboard orders={orders} />', '<DeliveredOrdersDashboard orders={orders} shift={shift} />')
          p.write_text(text, encoding='utf-8')

          # When a delivery is completed by the real flow, stamp the current
          # operation identity as well as the real Brazil delivery date.
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')
          old = """      deliveredTimestamp: newStatus === 'delivered' ? Date.now() : target.deliveredTimestamp,
    };"""
          new = """      deliveredTimestamp: newStatus === 'delivered' ? Date.now() : target.deliveredTimestamp,
      deliveredDate: newStatus === 'delivered' ? getBrazilDateKey() : target.deliveredDate,
      shiftId: newStatus === 'delivered' ? (shift.shiftId || target.shiftId) : target.shiftId,
      shiftDate: newStatus === 'delivered' ? (shift.shiftDate || getBrazilDateKey()) : target.shiftDate,
    };"""
          if old not in text:
              raise SystemExit('App delivered status block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------
          # Motoboy app: strict same-day stats + make the approved layout
          # visibly match the 4-screen reference (shorter header, metrics,
          # tabs and cleaner order/route cards).
          # ------------------------------------------------------------
          p = Path('src/components/MotoboyApp.tsx')
          text = p.read_text(encoding='utf-8')

          # Historical imported orders must not count as today's deliveries.
          old = """  const completedToday = useMemo(
    () =>
      orders
        .filter((order) => mine(order) && isDelivered(order) && deliveryDayKey(order) === todayKey)
        .sort((a, b) => {
          const aa = Number(a.deliveredTimestamp || Date.parse(String(a.deliveredAt || a.createdAt)) || 0);
          const bb = Number(b.deliveredTimestamp || Date.parse(String(b.deliveredAt || b.createdAt)) || 0);
          return bb - aa;
        }),
    [orders, driver?.id, todayKey]
  );"""
          new = """  const completedToday = useMemo(
    () =>
      orders
        .filter((order) => {
          if (!mine(order) || !isDelivered(order) || deliveryDayKey(order) !== todayKey) return false;
          const deliveredTs = Number(order.deliveredTimestamp || 0);
          const createdTs = Number(order.createdTimestamp || 0);
          if (!deliveredTs || !createdTs) return false;
          if (order.createdDate && order.createdDate !== todayKey) return false;
          if (shift.openedTimestamp && (deliveredTs < shift.openedTimestamp || createdTs < shift.openedTimestamp)) return false;
          if (shift.shiftId && order.shiftId && order.shiftId !== shift.shiftId) return false;
          return true;
        })
        .sort((a, b) => Number(b.deliveredTimestamp || 0) - Number(a.deliveredTimestamp || 0)),
    [orders, driver?.id, todayKey, shift.openedTimestamp, shift.shiftId]
  );"""
          if old not in text:
              raise SystemExit('Motoboy completedToday block not found')
          text = text.replace(old, new, 1)

          # Make history reliable too: require a real deliveredTimestamp/date,
          # but history itself can navigate previous days.
          text = text.replace(
              "const isDelivered = (order: Order) => order.status === 'delivered' && Boolean(order.deliveredTimestamp);",
              "const isDelivered = (order: Order) => order.status === 'delivered' && Number(order.deliveredTimestamp || 0) > 0;"
          )

          # Clearer status copy exactly like reference.
          text = text.replace("? '1º na fila · próximo'", "? '1º na fila · próximo'")
          text = text.replace("`${queuePosition}º na fila · ${queueAhead} ${queueAhead === 1 ? 'na frente' : 'na frente'}`", "`${queuePosition}º na fila · ${queueAhead} ${queueAhead === 1 ? 'na frente' : 'na frente'}`")

          # Compact shell/header/summary/tabs.
          replacements = {
            'className="mx-auto flex min-h-[100dvh] w-full max-w-md flex-col overflow-hidden bg-[#F4F6F9] text-slate-950 sm:min-h-[780px] sm:rounded-[28px] sm:border sm:border-slate-200 sm:shadow-2xl"': 'className="mx-auto flex min-h-[100dvh] w-full max-w-[430px] flex-col overflow-hidden bg-[#F4F6F9] text-slate-950 sm:min-h-[760px] sm:rounded-[30px] sm:border sm:border-slate-200 sm:shadow-2xl"',
            'className="bg-[#071A2E] px-4 pb-3 pt-[max(10px,env(safe-area-inset-top))] text-white"': 'className="bg-[#071A2E] px-4 pb-2 pt-[max(8px,env(safe-area-inset-top))] text-white"',
            'className="text-[22px] font-black leading-tight tracking-tight">Rota Fácil</h1>': 'className="text-[20px] font-black leading-tight tracking-tight">Rota Fácil</h1>',
            'className="mt-1 flex min-w-0 items-center gap-1.5 text-[10.5px] font-medium text-slate-300"': 'className="mt-0.5 flex min-w-0 items-center gap-1.5 text-[10px] font-semibold text-slate-300"',
            'className="grid grid-cols-3 divide-x divide-slate-200 border-b border-slate-200 bg-white px-2 py-2.5"': 'className="grid grid-cols-3 divide-x divide-slate-200 border-b border-slate-200 bg-white px-2 py-2"',
            'className="mt-1 text-[20px] font-black leading-none"': 'className="mt-1 text-[18px] font-black leading-none"',
            'className="mt-1 text-[16px] font-black leading-none"': 'className="mt-1 text-[15px] font-black leading-none"',
            'className="grid grid-cols-4 gap-1.5 bg-[#F4F6F9] px-2.5 py-2.5"': 'className="grid grid-cols-4 gap-1.5 bg-[#F4F6F9] px-2.5 py-2"',
            'className={`relative flex h-[58px] min-w-0 flex-col items-center justify-center gap-1 rounded-xl px-1 text-[10px] font-black transition ${': 'className={`relative flex h-[52px] min-w-0 flex-col items-center justify-center gap-1 rounded-xl px-1 text-[10px] font-black transition ${',
            '<main className="flex-1 space-y-3 px-3 pb-6">': '<main className="flex-1 space-y-2.5 px-3 pb-5">',
            'className="flex items-center gap-3 border-b border-slate-100 px-4 py-4"': 'className="flex items-center gap-3 border-b border-slate-100 px-4 py-3.5"',
            'className="rounded-xl border border-amber-200 bg-[#FFF9E8] p-4"': 'className="rounded-xl border border-amber-200 bg-[#FFF9E8] p-3.5"',
            'className="rounded-xl border border-emerald-200 bg-[#ECFDF7] p-4"': 'className="rounded-xl border border-emerald-200 bg-[#ECFDF7] p-3.5"',
            'className="mx-3 mb-3 flex items-start gap-2 rounded-xl bg-slate-50 px-3 py-3 text-[10px] leading-relaxed text-slate-500"': 'className="mx-3 mb-3 flex items-start gap-2 rounded-xl bg-slate-50 px-3 py-2.5 text-[10px] leading-relaxed text-slate-500"',
            'className="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-4"': 'className="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3.5"',
            "'border-violet-300 bg-violet-50/70 shadow-sm'": "'border-violet-300 bg-[#F7F3FF] shadow-sm'",
          }
          for a, b in replacements.items():
              text = text.replace(a, b)

          # Reference uses a solid purple primary button, not gradient.
          text = text.replace('bg-gradient-to-r from-violet-600 to-purple-600', 'bg-violet-600')

          # Label exactly "Confirmar retirada" when one, plural when multiple.
          text = text.replace(
              'Confirmar retirada dos {ready.length} pedidos',
              "{ready.length === 1 ? 'Confirmar retirada do pedido' : `Confirmar retirada dos ${ready.length} pedidos`}"
          )

          p.write_text(text, encoding='utf-8')

          # Force another PWA cache generation so installed app cannot keep old UI.
          p = Path('public/sw.js')
          sw = p.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = '[^']+';", "const CACHE_NAME = 'rotafacil-v6-approved-ui';", sw, count=1)
          p.write_text(sw, encoding='utf-8')

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r"/sw\.js\?v=[^'\"]+", "/sw.js?v=20260910-1924-v6", html)
          p.write_text(html, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-real-today-and-motoboy-ui.yml
          git add src/components/DeliveredOrdersDashboard.tsx src/components/StoreDashboardLegacy.tsx src/App.tsx src/components/MotoboyApp.tsx public/sw.js index.html
          git commit -m "fix: isolate current-shift deliveries and apply approved motoboy UI"
          git push origin main
