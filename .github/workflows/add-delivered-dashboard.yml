name: Add delivered dashboard

on:
  push:
    paths:
      - '.github/workflows/add-delivered-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire dashboard
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/StoreDashboardLegacy.tsx')
          text = p.read_text(encoding='utf-8')

          import_line = "import OperationDispatchView from './OperationDispatchView';\n"
          dashboard_import = "import DeliveredOrdersDashboard from './DeliveredOrdersDashboard';\n"
          if dashboard_import not in text:
              if import_line not in text:
                  raise SystemExit('OperationDispatchView import not found')
              text = text.replace(import_line, import_line + dashboard_import, 1)

          marker = """      {activeTab === 'operacao' && (\n        <OperationDispatchView"""
          start = text.find(marker)
          if start < 0:
              raise SystemExit('operation block not found')

          closing = """        />\n      )}\n\n      {/* KANBAN BOARD TAB */}"""
          insert = """        />\n      )}\n\n      {activeTab === 'operacao' && (\n        <DeliveredOrdersDashboard orders={orders} />\n      )}\n\n      {/* KANBAN BOARD TAB */}"""
          if closing not in text:
              raise SystemExit('operation closing marker not found')
          text = text.replace(closing, insert, 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-delivered-dashboard.yml
          git add src/components/StoreDashboardLegacy.tsx
          git commit -m "feat: show delivered orders dashboard on main page"
          git push origin main
