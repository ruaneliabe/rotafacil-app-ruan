name: Redesign delivery management modal

on:
  push:
    paths:
      - '.github/workflows/redesign-delivery-management-modal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply delivery management redesign
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/OperationDispatchView.tsx')
          text = path.read_text(encoding='utf-8')

          state_marker = "  const [mapMode, setMapMode] = useState<MapMode>('all');\n"
          state_add = state_marker + "  const [manageFilter, setManageFilter] = useState<'all' | 'route' | 'returning' | 'delivering' | 'available'>('all');\n"
          if "const [manageFilter, setManageFilter]" not in text:
            if state_marker not in text:
              raise SystemExit('mapMode state marker not found')
            text = text.replace(state_marker, state_add, 1)

          modal_start = text.find('      {manage && <div className="fixed inset-0 z-[80]')
          modal_end = text.find('\n    </div>\n  );', modal_start)
          if modal_start < 0 or modal_end < 0:
            raise SystemExit('management modal region not found')

          new_modal = r'''      {manage && (
        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-950/45 p-3 backdrop-blur-[2px]">
          <div className="flex h-[90vh] w-full max-w-[1540px] flex-col overflow-hidden rounded-[22px] border border-slate-200 bg-white shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-200 px-5 py-4">
              <div>
                <h3 className="text-[19px] font-black tracking-tight text-slate-950">Gestão de entrega</h3>
                <p className="mt-1 text-xs text-slate-500">Acompanhe entregadores, fila e pedidos em rota em uma única visão.</p>
              </div>
              <div className="flex items-center gap-3">
                <div className="hidden items-center gap-2 text-[10px] text-slate-400 md:flex"><span className="h-2 w-2 rounded-full bg-emerald-500" />Atualizado em tempo real</div>
                <button onClick={() => p.setIsRouteModalOpen(true)} className="hidden h-10 items-center gap-2 rounded-xl bg-violet-600 px-4 text-xs font-black text-white shadow-sm hover:bg-violet-500 sm:flex"><Zap className="h-4 w-4" />Novo despacho</button>
                <button onClick={() => { setManage(false); setFocusDriverId(null); setManageFilter('all'); }} className="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white hover:bg-slate-50"><X className="h-5 w-5 text-slate-500" /></button>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 border-b border-slate-200 bg-slate-50/50 p-3 md:grid-cols-5">
              {[
                { label: 'Disponíveis', value: motoboys.filter((m) => m.status === 'available' && load(m.id) === 0).length, helper: 'Livres para novos pedidos', icon: Users, tone: 'bg-emerald-50 text-emerald-600' },
                { label: 'Em rota', value: activeOrders.filter(isRoute).length, helper: 'Pedidos na rua agora', icon: Bike, tone: 'bg-blue-50 text-blue-600' },
                { label: 'Voltando', value: motoboys.filter((m) => m.status === 'returning_to_store').length, helper: 'Retornando para a loja', icon: Navigation, tone: 'bg-orange-50 text-orange-600' },
                { label: 'Na loja', value: queueDrivers.length, helper: 'Aguardando despacho', icon: PackageOpen, tone: 'bg-violet-50 text-violet-600' },
                { label: 'Fila', value: grouped.waiting.length, helper: 'Pedidos para atribuir', icon: PackageOpen, tone: 'bg-slate-100 text-slate-600' },
              ].map(({ label, value, helper, icon: Icon, tone }) => (
                <div key={label} className="rounded-2xl border border-slate-200 bg-white px-3 py-3 shadow-sm">
                  <div className="flex items-center gap-3">
                    <span className={`grid h-10 w-10 shrink-0 place-items-center rounded-xl ${tone}`}><Icon className="h-4 w-4" /></span>
                    <div className="min-w-0 flex-1"><div className="flex items-center justify-between gap-2"><span className="text-xs font-black text-slate-700">{label}</span><b className="text-lg leading-none text-slate-950">{value}</b></div><p className="mt-1 truncate text-[9px] text-slate-400">{helper}</p></div>
                  </div>
                </div>
              ))}
            </div>

            <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 bg-white px-4 py-3">
              {[
                ['all', 'Todos', activeOrders.length + motoboys.filter((m) => m.status !== 'offline').length],
                ['route', 'Em rota', activeOrders.filter(isRoute).length],
                ['returning', 'Voltando', motoboys.filter((m) => m.status === 'returning_to_store').length],
                ['delivering', 'Em entrega', motoboys.filter((m) => m.status === 'delivering').length],
                ['available', 'Disponíveis', motoboys.filter((m) => m.status === 'available').length],
              ].map(([id, label, count]) => (
                <button key={String(id)} onClick={() => setManageFilter(id as typeof manageFilter)} className={`inline-flex h-9 items-center gap-2 rounded-xl border px-3 text-[11px] font-black transition ${manageFilter === id ? 'border-violet-600 bg-violet-600 text-white shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-600 hover:bg-white'}`}>
                  {label}<span className={`rounded-md px-1.5 py-0.5 text-[9px] ${manageFilter === id ? 'bg-white/15 text-white' : 'bg-white text-slate-500'}`}>{count}</span>
                </button>
              ))}
            </div>

            <div className="grid min-h-0 flex-1 lg:grid-cols-[minmax(0,1fr)_390px]">
              <div className="relative min-h-[420px] bg-slate-100 p-3">
                <div className="h-full min-h-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                  <ReactiveRouteMap
                    origin={{ name: shift.storeName || 'Loja', address: shift.storeAddress || '', lat: shift.storeLat || -26.9194, lng: shift.storeLng || -49.0661 }}
                    stops={manageFilter === 'all' ? stops : manageFilter === 'route' ? stops.filter((s) => s.status === 'in_transit') : []}
                    motoboysList={manageFilter === 'all' ? mapDrivers : manageFilter === 'returning' ? mapDrivers.filter((m) => m.status === 'returning_to_store') : manageFilter === 'delivering' ? mapDrivers.filter((m) => m.status === 'delivering') : manageFilter === 'available' ? mapDrivers.filter((m) => m.status === 'available') : []}
                    selectedMotoboyId={focusDriverId}
                    onSelectMotoboy={(id: string | null) => setFocusDriverId(id)}
                  />
                </div>
                <div className="absolute bottom-6 left-6 rounded-xl border border-slate-200 bg-white/95 px-3 py-2 text-[10px] text-slate-500 shadow-lg backdrop-blur">
                  <div className="flex items-center gap-3"><span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-violet-600" />Loja</span><span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-blue-500" />Entregadores</span><span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-orange-500" />Pedidos</span></div>
                </div>
              </div>

              <aside className="min-h-0 overflow-y-auto border-l border-slate-200 bg-slate-50/60 p-3">
                <div className="relative mb-3"><Search className="absolute left-3 top-3 h-4 w-4 text-slate-400" /><input value={driverSearch} onChange={(e) => setDriverSearch(e.target.value)} placeholder="Buscar entregador..." className="h-10 w-full rounded-xl border border-slate-200 bg-white pl-9 pr-3 text-xs outline-none focus:border-violet-300 focus:ring-2 focus:ring-violet-100" /></div>

                <section className="mb-3 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 px-3.5 py-3"><div className="flex items-center gap-2"><PackageOpen className="h-4 w-4 text-slate-500" /><h4 className="text-xs font-black text-slate-800">Próximos da fila</h4><span className="rounded-full bg-slate-100 px-2 py-0.5 text-[9px] font-black text-slate-500">{queueDrivers.length}</span></div><span className="text-[9px] font-bold text-violet-600">Ordem de chegada</span></div>
                  <div className="divide-y divide-slate-100">
                    {queueDrivers.filter((m) => !driverSearch || m.name.toLowerCase().includes(driverSearch.toLowerCase())).slice(0, 6).map((m, index) => (
                      <button key={m.id} onClick={() => setFocusDriverId(focusDriverId === m.id ? null : m.id)} className="flex w-full items-center gap-3 px-3.5 py-2.5 text-left hover:bg-slate-50"><span className={`grid h-7 w-7 place-items-center rounded-full text-[10px] font-black ${index === 0 ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{index + 1}</span><div className="min-w-0 flex-1"><b className="block truncate text-[11px] text-slate-800">{m.name}</b><span className="text-[9px] text-slate-400">{index === 0 ? 'Próximo despacho' : `${index + 1}º da fila`}</span></div><ChevronRight className="h-4 w-4 text-slate-300" /></button>
                    ))}
                    {!queueDrivers.length && <div className="px-4 py-5 text-center text-[10px] text-slate-400">Nenhum entregador disponível na fila.</div>}
                  </div>
                </section>

                <section className="mb-3 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 px-3.5 py-3"><div className="flex items-center gap-2"><Bike className="h-4 w-4 text-blue-600" /><h4 className="text-xs font-black text-slate-800">Motoboys em entrega</h4><span className="rounded-full bg-blue-50 px-2 py-0.5 text-[9px] font-black text-blue-600">{motoboys.filter((m) => m.status === 'delivering').length}</span></div></div>
                  <div className="divide-y divide-slate-100">
                    {motoboys.filter((m) => m.status === 'delivering' && (!driverSearch || m.name.toLowerCase().includes(driverSearch.toLowerCase()))).map((m) => { const order = activeOrders.find((o) => o.assignedMotoboyId === m.id && isRoute(o)); return <button key={m.id} onClick={() => setFocusDriverId(focusDriverId === m.id ? null : m.id)} className="flex w-full items-center gap-3 px-3.5 py-2.5 text-left hover:bg-slate-50"><span className="grid h-8 w-8 place-items-center rounded-full bg-blue-50 text-blue-600"><Bike className="h-4 w-4" /></span><div className="min-w-0 flex-1"><div className="flex items-center gap-2"><b className="truncate text-[11px] text-slate-800">{m.name}</b>{order && <span className="text-[9px] font-black text-slate-500">{code(order)}</span>}</div><p className="mt-0.5 truncate text-[9px] text-slate-400">{order?.address || 'Entrega em andamento'}</p></div><span className="whitespace-nowrap rounded-full bg-emerald-50 px-2 py-1 text-[9px] font-black text-emerald-600">Em entrega</span></button>; })}
                    {!motoboys.some((m) => m.status === 'delivering') && <div className="px-4 py-5 text-center text-[10px] text-slate-400">Nenhum motoboy em entrega agora.</div>}
                  </div>
                </section>

                <section className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                  <div className="flex items-center justify-between border-b border-slate-100 px-3.5 py-3"><div className="flex items-center gap-2"><Navigation className="h-4 w-4 text-orange-500" /><h4 className="text-xs font-black text-slate-800">Motoboys voltando</h4><span className="rounded-full bg-orange-50 px-2 py-0.5 text-[9px] font-black text-orange-600">{motoboys.filter((m) => m.status === 'returning_to_store').length}</span></div></div>
                  <div className="divide-y divide-slate-100">
                    {motoboys.filter((m) => m.status === 'returning_to_store' && (!driverSearch || m.name.toLowerCase().includes(driverSearch.toLowerCase()))).map((m) => <button key={m.id} onClick={() => setFocusDriverId(focusDriverId === m.id ? null : m.id)} className="flex w-full items-center gap-3 px-3.5 py-2.5 text-left hover:bg-slate-50"><span className="grid h-8 w-8 place-items-center rounded-full bg-orange-50 text-orange-500"><Navigation className="h-4 w-4" /></span><div className="min-w-0 flex-1"><b className="block truncate text-[11px] text-slate-800">{m.name}</b><p className="mt-0.5 text-[9px] text-slate-400">Retornando para a loja</p></div><button onClick={(e) => { e.stopPropagation(); handleCallCounter(m.id, m.name); }} className="rounded-lg bg-violet-50 px-2 py-1.5 text-[9px] font-black text-violet-700">Chamar</button></button>)}
                    {!motoboys.some((m) => m.status === 'returning_to_store') && <div className="px-4 py-5 text-center text-[10px] text-slate-400">Nenhum entregador retornando no momento.</div>}
                  </div>
                </section>
              </aside>
            </div>
          </div>
        </div>
      )}
'''

          text = text[:modal_start] + new_modal + text[modal_end:]
          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OperationDispatchView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: redesign delivery management screen"
          git push origin main
